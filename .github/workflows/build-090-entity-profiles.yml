name: Build 0.9.0 entity profiles

on:
  push:
    paths:
      - '.github/workflows/build-090-entity-profiles.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build entity-profile feature
        run: |
          cat > custom_components/nibe_local/profiles.py <<'PYFILE'
          """Entity profile selection for NIBE Local REST API."""
          from __future__ import annotations

          from collections.abc import Iterable

          from .const import POINTS

          PROFILE_MINIMAL = "minimal"
          PROFILE_STANDARD = "standard"
          PROFILE_EXTENDED = "extended"
          PROFILE_COMPLETE = "complete"
          PROFILE_INDIVIDUAL = "individual"
          ENTITY_PROFILES = (
              PROFILE_MINIMAL,
              PROFILE_STANDARD,
              PROFILE_EXTENDED,
              PROFILE_COMPLETE,
              PROFILE_INDIVIDUAL,
          )
          DEFAULT_ENTITY_PROFILE = PROFILE_EXTENDED

          # Small, dashboard-oriented core: operating state, main temperatures,
          # hot water, compressor, flow and the most useful user controls.
          MINIMAL_POINT_IDS = frozenset(
              {
                  4, 8, 10, 11, 12, 58, 781, 1758, 1975, 2022,
                  2500, 2657, 3096, 3101, 3697, 3751, 3920, 3921,
                  4030, 4064, 4564,
              }
          )

          # Normal Home Assistant use: the minimal set plus calculated targets,
          # heating/cooling curves, hot-water controls, energy, compressor details,
          # defrost state and common ventilation values.
          STANDARD_POINT_IDS = MINIMAL_POINT_IDS | frozenset(
              {
                  54, 158, 1708, 1716, 1829, 1942, 2002, 2491, 2494,
                  2505, 2506, 2507, 25165, 25166, 2683, 2685, 2691,
                  2695, 2729, 2766, 2767, 2792, 3095, 3097, 3098,
                  3138, 3170, 3252, 3353, 3354, 3667, 3671, 3699,
                  3700, 3701, 3703, 3704, 3705, 3706, 3707, 3708,
                  3830, 4040, 5025, 5033, 8060,
              }
          )

          KNOWN_POINT_IDS = frozenset(definition.point_id for definition in POINTS)


          def normalize_selected_ids(values: Iterable[object] | None) -> frozenset[int]:
              """Normalize persisted point IDs while ignoring malformed values."""
              result: set[int] = set()
              for value in values or ():
                  try:
                      result.add(int(value))
                  except (TypeError, ValueError):
                      continue
              return frozenset(result)


          def point_enabled(
              profile: str,
              point_id: int,
              selected_ids: Iterable[object] | None = None,
          ) -> bool:
              """Return whether a NIBE point belongs to the configured profile."""
              if profile == PROFILE_COMPLETE:
                  return True
              if profile == PROFILE_INDIVIDUAL:
                  return point_id in normalize_selected_ids(selected_ids)
              if profile == PROFILE_MINIMAL:
                  return point_id in MINIMAL_POINT_IDS
              if profile == PROFILE_STANDARD:
                  return point_id in STANDARD_POINT_IDS
              # Extended is also the compatibility fallback for pre-0.9 entries.
              return point_id in KNOWN_POINT_IDS
          PYFILE

          cat > custom_components/nibe_local/config_flow.py <<'PYFILE'
          """Config and options flow for NIBE Local REST API."""
          from __future__ import annotations

          from typing import Any

          import voluptuous as vol

          from homeassistant import config_entries
          from homeassistant.config_entries import ConfigEntry
          from homeassistant.const import CONF_HOST, CONF_PASSWORD, CONF_PORT, CONF_USERNAME
          from homeassistant.helpers.aiohttp_client import async_get_clientsession
          from homeassistant.helpers.selector import (
              SelectSelector,
              SelectSelectorConfig,
              TextSelector,
              TextSelectorConfig,
              TextSelectorType,
          )

          from .api import NibeApiError, NibeAuthError, NibeLocalApi, async_resolve_host_ip
          from .const import (
              AUTH_METHOD_BASIC,
              AUTH_METHOD_HEADER,
              COMMAND_POLL_DELAY_OPTIONS_MS,
              CONF_AUTH_HEADER,
              CONF_AUTH_METHOD,
              CONF_COMMAND_POLL_DELAY_MS,
              CONF_ENTITY_PROFILE,
              CONF_SCAN_INTERVAL,
              CONF_SELECTED_POINT_IDS,
              CONF_VERIFY_SSL,
              DEFAULT_COMMAND_POLL_DELAY_MS,
              DEFAULT_PORT,
              DEFAULT_SCAN_INTERVAL,
              DOMAIN,
              MIN_SCAN_INTERVAL,
              NIBE_DEVICE_ID,
          )
          from .profiles import (
              DEFAULT_ENTITY_PROFILE,
              ENTITY_PROFILES,
              PROFILE_INDIVIDUAL,
              normalize_selected_ids,
          )

          _AUTH_KEYS = (CONF_AUTH_METHOD, CONF_USERNAME, CONF_PASSWORD, CONF_AUTH_HEADER)
          _AUTH_METHODS = (AUTH_METHOD_BASIC, AUTH_METHOD_HEADER)


          def _secret_selector(*, autocomplete: str | None = None) -> TextSelector:
              """Create a masked text selector for credentials."""
              config = TextSelectorConfig(type=TextSelectorType.PASSWORD)
              if autocomplete is not None:
                  config["autocomplete"] = autocomplete
              return TextSelector(config)


          def _secret_is_blank(value: object) -> bool:
              """Return whether a secret field was effectively left empty."""
              return value is None or (isinstance(value, str) and not value.strip())


          def auth_method_from_values(values: dict) -> str:
              """Return the configured auth method, inferring it for pre-0.8 entries."""
              configured = values.get(CONF_AUTH_METHOD)
              if configured in _AUTH_METHODS:
                  return configured
              if not _secret_is_blank(values.get(CONF_AUTH_HEADER)):
                  return AUTH_METHOD_HEADER
              return AUTH_METHOD_BASIC


          def merge_auth_settings(candidate: dict, current: dict) -> dict:
              """Merge auth settings while keeping exactly one authentication method active."""
              merged = {**current, **candidate}
              method = candidate.get(CONF_AUTH_METHOD)
              if method not in _AUTH_METHODS:
                  method = auth_method_from_values(current)
              merged[CONF_AUTH_METHOD] = method
              current_method = auth_method_from_values(current)
              method_unchanged = method == current_method

              if method == AUTH_METHOD_BASIC:
                  if _secret_is_blank(candidate.get(CONF_PASSWORD)):
                      merged[CONF_PASSWORD] = (
                          current.get(CONF_PASSWORD, "") if method_unchanged else ""
                      )
                  merged[CONF_AUTH_HEADER] = ""
              else:
                  if _secret_is_blank(candidate.get(CONF_AUTH_HEADER)):
                      merged[CONF_AUTH_HEADER] = (
                          current.get(CONF_AUTH_HEADER, "") if method_unchanged else ""
                      )
                  merged[CONF_USERNAME] = ""
                  merged[CONF_PASSWORD] = ""

              return merged


          def _auth_method_selector() -> SelectSelector:
              return SelectSelector(
                  SelectSelectorConfig(
                      options=list(_AUTH_METHODS),
                      translation_key="auth_method",
                  )
              )


          def _entity_profile_selector() -> SelectSelector:
              return SelectSelector(
                  SelectSelectorConfig(
                      options=list(ENTITY_PROFILES),
                      translation_key="entity_profile",
                  )
              )


          def _connection_schema(
              defaults: dict,
              *,
              password_default: str = "",
              auth_header_default: str = "",
          ) -> vol.Schema:
              return vol.Schema(
                  {
                      vol.Required(CONF_HOST, default=defaults.get(CONF_HOST, "")): str,
                      vol.Required(CONF_PORT, default=defaults.get(CONF_PORT, DEFAULT_PORT)): vol.All(
                          int, vol.Range(min=1, max=65535)
                      ),
                      vol.Required(
                          CONF_AUTH_METHOD, default=auth_method_from_values(defaults)
                      ): _auth_method_selector(),
                      vol.Optional(CONF_USERNAME, default=defaults.get(CONF_USERNAME, "")): str,
                      vol.Optional(CONF_PASSWORD, default=password_default): _secret_selector(
                          autocomplete="current-password"
                      ),
                      vol.Optional(CONF_AUTH_HEADER, default=auth_header_default): _secret_selector(),
                      vol.Required(
                          CONF_VERIFY_SSL, default=defaults.get(CONF_VERIFY_SSL, False)
                      ): bool,
                      vol.Required(
                          CONF_SCAN_INTERVAL,
                          default=defaults.get(CONF_SCAN_INTERVAL, DEFAULT_SCAN_INTERVAL),
                      ): vol.All(int, vol.Range(min=MIN_SCAN_INTERVAL, max=600)),
                      vol.Required(
                          CONF_COMMAND_POLL_DELAY_MS,
                          default=defaults.get(
                              CONF_COMMAND_POLL_DELAY_MS, DEFAULT_COMMAND_POLL_DELAY_MS
                          ),
                      ): vol.In(COMMAND_POLL_DELAY_OPTIONS_MS),
                  }
              )


          def _options_schema(current: dict) -> vol.Schema:
              fields = dict(
                  _connection_schema(
                      current,
                      password_default="",
                      auth_header_default="",
                  ).schema
              )
              fields[
                  vol.Required(
                      CONF_ENTITY_PROFILE,
                      default=current.get(CONF_ENTITY_PROFILE, DEFAULT_ENTITY_PROFILE),
                  )
              ] = _entity_profile_selector()
              return vol.Schema(fields)


          def _reauth_schema(current: dict) -> vol.Schema:
              if auth_method_from_values(current) == AUTH_METHOD_HEADER:
                  return vol.Schema(
                      {vol.Optional(CONF_AUTH_HEADER, default=""): _secret_selector()}
                  )
              return vol.Schema(
                  {
                      vol.Optional(CONF_USERNAME, default=current.get(CONF_USERNAME, "")): str,
                      vol.Optional(CONF_PASSWORD, default=""): _secret_selector(
                          autocomplete="current-password"
                      ),
                  }
              )


          def _api(hass, values: dict) -> NibeLocalApi:
              return NibeLocalApi(
                  async_get_clientsession(hass),
                  host=values[CONF_HOST],
                  port=values[CONF_PORT],
                  username=values.get(CONF_USERNAME),
                  password=values.get(CONF_PASSWORD),
                  auth_header=values.get(CONF_AUTH_HEADER),
                  auth_method=values.get(CONF_AUTH_METHOD),
                  verify_ssl=values[CONF_VERIFY_SSL],
              )


          async def _validate(hass, values: dict) -> dict:
              return await _api(hass, values).get_device()


          async def _validate_and_discover(hass, values: dict) -> tuple[dict, dict[str, Any]]:
              api = _api(hass, values)
              device = await api.get_device()
              points = await api.get_points()
              return device, points


          def _point_label(point_id: str, point: dict[str, Any]) -> str:
              metadata = point.get("metadata") or {}
              description = (
                  point.get("description")
                  or point.get("name")
                  or metadata.get("description")
                  or metadata.get("name")
                  or f"Variable {point_id}"
              )
              text = str(description).replace("\u00ad", "").strip().replace("\n", " ")
              unit = metadata.get("shortUnit") or metadata.get("unit")
              suffix = f" [{unit}]" if unit else ""
              return f"{point_id} | {text[:120]}{suffix}"


          def _point_options(points: dict[str, Any]) -> list[str]:
              def sort_key(item: tuple[str, Any]) -> tuple[int, str]:
                  key = str(item[0])
                  return (int(key) if key.isdigit() else 2**31, key)

              return [_point_label(str(pid), point) for pid, point in sorted(points.items(), key=sort_key)]


          def _selected_options(points: dict[str, Any], selected_ids) -> list[str]:
              selected = normalize_selected_ids(selected_ids)
              labels = {int(pid): _point_label(str(pid), point) for pid, point in points.items() if str(pid).isdigit()}
              return [labels[pid] for pid in sorted(selected) if pid in labels]


          def _parse_selected_options(values) -> list[int]:
              point_ids: set[int] = set()
              for value in values or ():
                  prefix = str(value).split(" | ", 1)[0].strip()
                  try:
                      point_ids.add(int(prefix))
                  except ValueError:
                      continue
              return sorted(point_ids)


          def _entity_selection_schema(
              points: dict[str, Any], selected_ids=None
          ) -> vol.Schema:
              return vol.Schema(
                  {
                      vol.Optional(
                          CONF_SELECTED_POINT_IDS,
                          default=_selected_options(points, selected_ids),
                      ): SelectSelector(
                          SelectSelectorConfig(
                              options=_point_options(points),
                              multiple=True,
                          )
                      )
                  }
              )


          class NibeLocalConfigFlow(config_entries.ConfigFlow, domain=DOMAIN):
              VERSION = 2

              _reauth_entry: ConfigEntry | None = None
              _pending_data: dict | None = None
              _pending_device: dict | None = None
              _available_points: dict[str, Any] | None = None

              async def async_step_user(self, user_input=None):
                  errors: dict[str, str] = {}
                  if user_input is not None:
                      candidate = merge_auth_settings(dict(user_input), {})
                      try:
                          device, points = await _validate_and_discover(self.hass, candidate)
                      except NibeAuthError:
                          errors["base"] = "invalid_auth"
                      except NibeApiError:
                          errors["base"] = "cannot_connect"
                      else:
                          product = device.get("product") or {}
                          serial = product.get("serialNumber") or (
                              f"{candidate[CONF_HOST]}:{NIBE_DEVICE_ID}"
                          )
                          await self.async_set_unique_id(str(serial))
                          self._abort_if_unique_id_configured()
                          self._pending_data = candidate
                          self._pending_device = device
                          self._available_points = points
                          return await self.async_step_entity_profile()

                  return self.async_show_form(
                      step_id="user",
                      data_schema=_connection_schema({}),
                      errors=errors,
                  )

              def _create_pending_entry(self):
                  if self._pending_data is None or self._pending_device is None:
                      return self.async_abort(reason="setup_state_missing")
                  product = self._pending_device.get("product") or {}
                  title = product.get("name") or "NIBE API"
                  return self.async_create_entry(title=title, data=self._pending_data)

              async def async_step_entity_profile(self, user_input=None):
                  if self._pending_data is None:
                      return self.async_abort(reason="setup_state_missing")
                  if user_input is not None:
                      profile = str(user_input[CONF_ENTITY_PROFILE])
                      self._pending_data[CONF_ENTITY_PROFILE] = profile
                      if profile == PROFILE_INDIVIDUAL:
                          return await self.async_step_entity_selection()
                      return self._create_pending_entry()

                  return self.async_show_form(
                      step_id="entity_profile",
                      data_schema=vol.Schema(
                          {
                              vol.Required(
                                  CONF_ENTITY_PROFILE,
                                  default=DEFAULT_ENTITY_PROFILE,
                              ): _entity_profile_selector()
                          }
                      ),
                  )

              async def async_step_entity_selection(self, user_input=None):
                  if self._pending_data is None:
                      return self.async_abort(reason="setup_state_missing")
                  points = self._available_points or {}
                  if user_input is not None:
                      self._pending_data[CONF_SELECTED_POINT_IDS] = _parse_selected_options(
                          user_input.get(CONF_SELECTED_POINT_IDS)
                      )
                      return self._create_pending_entry()

                  return self.async_show_form(
                      step_id="entity_selection",
                      data_schema=_entity_selection_schema(points),
                      description_placeholders={"count": str(len(points))},
                  )

              async def async_step_reauth(self, entry_data: dict):
                  self._reauth_entry = self.hass.config_entries.async_get_entry(
                      self.context["entry_id"]
                  )
                  if self._reauth_entry is None:
                      return self.async_abort(reason="reauth_entry_missing")
                  return await self.async_step_reauth_confirm()

              async def async_step_reauth_confirm(self, user_input=None):
                  errors: dict[str, str] = {}
                  if self._reauth_entry is None:
                      return self.async_abort(reason="reauth_entry_missing")

                  current = {**self._reauth_entry.data, **self._reauth_entry.options}
                  if user_input is not None:
                      candidate = merge_auth_settings(dict(user_input), current)
                      try:
                          await _validate(self.hass, candidate)
                      except NibeAuthError:
                          errors["base"] = "invalid_auth"
                      except NibeApiError:
                          errors["base"] = "cannot_connect"
                      else:
                          new_data = dict(self._reauth_entry.data)
                          new_options = dict(self._reauth_entry.options)
                          for key in _AUTH_KEYS:
                              new_data[key] = candidate.get(key, "")
                              new_options.pop(key, None)
                          self.hass.config_entries.async_update_entry(
                              self._reauth_entry,
                              data=new_data,
                              options=new_options,
                          )
                          return self.async_abort(reason="reauth_successful")

                  host = str(current.get(CONF_HOST, ""))
                  ip_address = await async_resolve_host_ip(host) if host else None
                  return self.async_show_form(
                      step_id="reauth_confirm",
                      data_schema=_reauth_schema(current),
                      errors=errors,
                      description_placeholders={
                          "device_name": self._reauth_entry.title or "NIBE Local REST API",
                          "host": host or "–",
                          "ip_address": ip_address or "–",
                      },
                  )

              @staticmethod
              def async_get_options_flow(config_entry):
                  return NibeLocalOptionsFlow()


          class NibeLocalOptionsFlow(config_entries.OptionsFlow):
              """Edit connection, polling and entity-profile settings after setup."""

              _pending_options: dict | None = None
              _available_points: dict[str, Any] | None = None

              async def async_step_init(self, user_input=None):
                  errors: dict[str, str] = {}
                  current = {**self.config_entry.data, **self.config_entry.options}

                  if user_input is not None:
                      candidate = merge_auth_settings(dict(user_input), current)
                      profile = str(
                          user_input.get(
                              CONF_ENTITY_PROFILE,
                              current.get(CONF_ENTITY_PROFILE, DEFAULT_ENTITY_PROFILE),
                          )
                      )
                      candidate[CONF_ENTITY_PROFILE] = profile
                      try:
                          _device, points = await _validate_and_discover(self.hass, candidate)
                      except NibeAuthError:
                          errors["base"] = "invalid_auth"
                      except NibeApiError:
                          errors["base"] = "cannot_connect"
                      else:
                          if profile == PROFILE_INDIVIDUAL:
                              self._pending_options = candidate
                              self._available_points = points
                              return await self.async_step_entity_selection()
                          return self.async_create_entry(title="", data=candidate)

                  return self.async_show_form(
                      step_id="init",
                      data_schema=_options_schema(current),
                      errors=errors,
                  )

              async def async_step_entity_selection(self, user_input=None):
                  if self._pending_options is None:
                      return self.async_abort(reason="setup_state_missing")
                  points = self._available_points or {}
                  if user_input is not None:
                      self._pending_options[CONF_SELECTED_POINT_IDS] = _parse_selected_options(
                          user_input.get(CONF_SELECTED_POINT_IDS)
                      )
                      return self.async_create_entry(title="", data=self._pending_options)

                  return self.async_show_form(
                      step_id="entity_selection",
                      data_schema=_entity_selection_schema(
                          points,
                          self._pending_options.get(CONF_SELECTED_POINT_IDS),
                      ),
                      description_placeholders={"count": str(len(points))},
                  )
          PYFILE

          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path: str, old: str, new: str, *, count: int = -1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Configuration keys.
          replace(
              'custom_components/nibe_local/const.py',
              'CONF_COMMAND_POLL_DELAY_MS = "command_poll_delay_ms"\n',
              'CONF_COMMAND_POLL_DELAY_MS = "command_poll_delay_ms"\nCONF_ENTITY_PROFILE = "entity_profile"\nCONF_SELECTED_POINT_IDS = "selected_point_ids"\n',
          )

          # Coordinator owns the runtime profile decision while retaining all points
          # internally for dependencies used by writable entities.
          replace(
              'custom_components/nibe_local/coordinator.py',
              'from .const import DOMAIN, POINTS\n',
              'from .const import DOMAIN, POINTS\nfrom .profiles import DEFAULT_ENTITY_PROFILE, point_enabled\n',
          )
          replace(
              'custom_components/nibe_local/coordinator.py',
              '        instance_id: str | None = None,\n    ) -> None:',
              '        instance_id: str | None = None,\n        entity_profile: str = DEFAULT_ENTITY_PROFILE,\n        selected_point_ids=None,\n    ) -> None:',
          )
          replace(
              'custom_components/nibe_local/coordinator.py',
              '        self.instance_id = instance_id or api.device_id\n        self._fallback_failure_streak = 0',
              '        self.instance_id = instance_id or api.device_id\n        self.entity_profile = entity_profile\n        self.selected_point_ids = tuple(selected_point_ids or ())\n        self._fallback_failure_streak = 0',
          )
          replace(
              'custom_components/nibe_local/coordinator.py',
              '    def point(self, point_id: int) -> dict[str, Any] | None:\n        return (self.data or {}).get("points", {}).get(str(point_id))\n',
              '''    def entity_enabled(self, point_id: int) -> bool:\n        """Return whether this point should be exposed as an entity."""\n        return point_enabled(\n            self.entity_profile, point_id, self.selected_point_ids\n        )\n\n    @property\n    def enabled_point_ids(self) -> set[int]:\n        """Return currently available point IDs selected by the active profile."""\n        result: set[int] = set()\n        for point_id in (self.data or {}).get("points", {}):\n            try:\n                normalized = int(point_id)\n            except (TypeError, ValueError):\n                continue\n            if self.entity_enabled(normalized):\n                result.add(normalized)\n        return result\n\n    def point(self, point_id: int) -> dict[str, Any] | None:\n        return (self.data or {}).get("points", {}).get(str(point_id))\n''',
          )

          # Runtime setup: pre-0.9 entries default to Extended, preserving today's entities.
          replace(
              'custom_components/nibe_local/__init__.py',
              '    CONF_COMMAND_POLL_DELAY_MS,\n    CONF_SCAN_INTERVAL,',
              '    CONF_COMMAND_POLL_DELAY_MS,\n    CONF_ENTITY_PROFILE,\n    CONF_SCAN_INTERVAL,\n    CONF_SELECTED_POINT_IDS,',
          )
          replace(
              'custom_components/nibe_local/__init__.py',
              'from .coordinator import NibeCoordinator\n',
              'from .coordinator import NibeCoordinator\nfrom .profiles import DEFAULT_ENTITY_PROFILE\n',
          )
          replace(
              'custom_components/nibe_local/__init__.py',
              '        instance_id=entry.entry_id,\n    )',
              '        instance_id=entry.entry_id,\n        entity_profile=data.get(CONF_ENTITY_PROFILE, DEFAULT_ENTITY_PROFILE),\n        selected_point_ids=data.get(CONF_SELECTED_POINT_IDS, ()),\n    )',
          )

          # Every known platform now honors the selected profile.
          replace(
              'custom_components/nibe_local/sensor.py',
              '        if definition.platform == "sensor" and coordinator.point(definition.point_id)\n',
              '        if definition.platform == "sensor"\n        and coordinator.entity_enabled(definition.point_id)\n        and coordinator.point(definition.point_id)\n',
          )
          replace(
              'custom_components/nibe_local/binary_sensor.py',
              '        if definition.platform == "binary_sensor"\n        and coordinator.point(definition.point_id)\n',
              '        if definition.platform == "binary_sensor"\n        and coordinator.entity_enabled(definition.point_id)\n        and coordinator.point(definition.point_id)\n',
          )
          for path, platform in [
              ('custom_components/nibe_local/number.py', 'number'),
              ('custom_components/nibe_local/select.py', 'select'),
              ('custom_components/nibe_local/switch.py', 'switch'),
              ('custom_components/nibe_local/time.py', 'time'),
          ]:
              replace(
                  path,
                  f'        if definition.platform != "{platform}":\n            continue\n',
                  f'        if definition.platform != "{platform}":\n            continue\n        if not coordinator.entity_enabled(definition.point_id):\n            continue\n',
                  count=1,
              )

          # Synthetic ventilation switch follows the ventilation point selection.
          replace(
              'custom_components/nibe_local/switch.py',
              '    if ventilation_point and (ventilation_point.get("metadata") or {}).get(\n',
              '    if (\n        coordinator.entity_enabled(POINT_VENTILATION_MODE)\n        and ventilation_point\n        and (ventilation_point.get("metadata") or {}).get(\n',
          )
          replace(
              'custom_components/nibe_local/switch.py',
              '        "isWritable", False\n    ):\n        entities.append(NibeVentilationPlusSwitch(coordinator))',
              '            "isWritable", False\n        )\n    ):\n        entities.append(NibeVentilationPlusSwitch(coordinator))',
          )

          # Generic read-only sensors for selected points not yet curated in POINTS.
          sensor = Path('custom_components/nibe_local/sensor.py')
          text = sensor.read_text(encoding='utf-8')
          old = '''    entities: list[SensorEntity] = [\n        NibeSensor(coordinator, definition) for definition in definitions\n    ]\n    entities.extend(\n'''
          new = '''    entities: list[SensorEntity] = [\n        NibeSensor(coordinator, definition) for definition in definitions\n    ]\n    known_ids = {definition.point_id for definition in POINTS}\n    entities.extend(\n        NibeDiscoveredSensor(coordinator, point_id)\n        for point_id in sorted(coordinator.enabled_point_ids - known_ids)\n    )\n    entities.extend(\n'''
          if old not in text:
              raise RuntimeError('sensor setup insertion point missing')
          text = text.replace(old, new, 1)
          marker = '\n\nclass NibeSensor(NibePointEntity, SensorEntity):\n'
          discovered = '''\n\nclass NibeDiscoveredSensor(CoordinatorEntity[NibeCoordinator], SensorEntity):\n    """Read-only sensor for a NIBE point not yet curated by the integration."""\n\n    _attr_has_entity_name = True\n\n    def __init__(self, coordinator: NibeCoordinator, point_id: int) -> None:\n        super().__init__(coordinator)\n        self.point_id = point_id\n        self._attr_unique_id = entity_unique_id(coordinator, point_id)\n\n    @property\n    def point(self) -> dict[str, Any]:\n        return self.coordinator.point(self.point_id) or {}\n\n    @property\n    def name(self) -> str:\n        point = self.point\n        metadata = point.get("metadata") or {}\n        description = (\n            point.get("description")\n            or point.get("name")\n            or metadata.get("description")\n            or metadata.get("name")\n        )\n        if description:\n            return str(description).replace("\\u00ad", "").strip()\n        return f"NIBE Variable {self.point_id}"\n\n    @property\n    def native_value(self):\n        return scaled_value(self.point)\n\n    @property\n    def native_unit_of_measurement(self) -> str | None:\n        metadata = self.point.get("metadata") or {}\n        return normalize_unit(metadata.get("shortUnit") or metadata.get("unit"))\n\n    @property\n    def available(self) -> bool:\n        if not self.coordinator.last_update_success or not self.point:\n            return False\n        return bool((self.point.get("value") or self.point.get("datavalue") or {}).get("isOk", True))\n\n    @property\n    def device_info(self):\n        return coordinator_device_info(self.coordinator)\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        metadata = self.point.get("metadata") or {}\n        return {\n            "point_id": self.point_id,\n            "description": str(self.point.get("description") or "").replace("\\u00ad", "").strip(),\n            "variable_type": metadata.get("variableType"),\n            "is_writable": metadata.get("isWritable"),\n            "discovered": True,\n        }\n'''
          if marker not in text:
              raise RuntimeError('sensor class marker missing')
          text = text.replace(marker, discovered + marker, 1)
          sensor.write_text(text, encoding='utf-8')

          # Manifest and changelog.
          manifest_path = Path('custom_components/nibe_local/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.9.0'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '## 0.9.0\n\n'
          bullets = (
              '- Neue Entitätsprofile **Minimal**, **Standard**, **Erweitert**, **Komplett** und **Individuell** bei der Einrichtung.\n'
              '- Nach erfolgreicher Authentifizierung liest der Config Flow die aktuell verfügbaren NIBE-Variablen ein; bei **Individuell** können die gewünschten Variablen per Mehrfachauswahl festgelegt werden.\n'
              '- Die Profilwahl und individuelle Variable-IDs werden dauerhaft im Config Entry gespeichert und bleiben bei Neustarts, Reloads und Integrationsupdates erhalten.\n'
              '- Die Entitätsauswahl kann später über die Integrationsoptionen geändert werden. Bestehende Installationen ohne Profilfeld verwenden automatisch **Erweitert**, damit der bisherige Entitätsumfang erhalten bleibt.\n'
              '- **Komplett** stellt alle vom Gerät gemeldeten Punkte bereit. Noch nicht kuratierte Variablen werden ausschließlich als generische, schreibgeschützte Sensoren angelegt; unbekannte Servicepunkte erhalten keine automatische Schreibfunktion.\n\n'
          )
          if '## 0.9.0' not in text:
              text = text.replace('## 0.8.1\n', heading + bullets + '## 0.8.1\n', 1)
          changelog.write_text(text, encoding='utf-8')

          # Translation additions for setup/options/profile selectors.
          translations = {
              'de.json': {
                  'profile_title': 'Entitätsumfang auswählen',
                  'profile_description': 'Wähle, wie viele der verfügbaren NIBE-Variablen als Entitäten angelegt werden sollen. Erweitert entspricht dem bisherigen Umfang der Integration.',
                  'selection_title': 'Entitäten individuell auswählen',
                  'selection_description': '{count} Variablen wurden von der NIBE erkannt. Wähle die Variablen aus, die als Entitäten angelegt werden sollen.',
                  'selection_data': 'NIBE-Variablen',
                  'profile_data': 'Entitätsprofil',
                  'options_description': 'IP-Adresse, Authentifizierung, Abfrageintervall und Entitätsprofil ändern. Ein leeres geheimes Feld behält den gespeicherten Wert bei.',
                  'profiles': {'minimal':'Minimal','standard':'Standard','extended':'Erweitert','complete':'Komplett','individual':'Individuell'},
              },
              'en.json': {
                  'profile_title': 'Choose entity scope',
                  'profile_description': 'Choose how many available NIBE variables should be exposed as entities. Extended matches the previous integration scope.',
                  'selection_title': 'Choose entities individually',
                  'selection_description': '{count} variables were discovered on the NIBE. Select the variables that should be exposed as entities.',
                  'selection_data': 'NIBE variables',
                  'profile_data': 'Entity profile',
                  'options_description': 'Change host, authentication, polling interval, and entity profile. Leave a secret field empty to keep its stored value.',
                  'profiles': {'minimal':'Minimal','standard':'Standard','extended':'Extended','complete':'Complete','individual':'Individual'},
              },
          }
          for filename, values in translations.items():
              path = Path('custom_components/nibe_local/translations') / filename
              data = json.loads(path.read_text(encoding='utf-8'))
              config_steps = data.setdefault('config', {}).setdefault('step', {})
              config_steps['entity_profile'] = {
                  'title': values['profile_title'],
                  'description': values['profile_description'],
                  'data': {'entity_profile': values['profile_data']},
              }
              config_steps['entity_selection'] = {
                  'title': values['selection_title'],
                  'description': values['selection_description'],
                  'data': {'selected_point_ids': values['selection_data']},
              }
              data.setdefault('config', {}).setdefault('abort', {})['setup_state_missing'] = (
                  'Einrichtungsstatus ist abgelaufen. Bitte die Einrichtung erneut starten.'
                  if filename == 'de.json'
                  else 'Setup state expired. Please start setup again.'
              )
              options_steps = data.setdefault('options', {}).setdefault('step', {})
              init = options_steps.setdefault('init', {})
              init['description'] = values['options_description']
              init.setdefault('data', {})['entity_profile'] = values['profile_data']
              options_steps['entity_selection'] = {
                  'title': values['selection_title'],
                  'description': values['selection_description'],
                  'data': {'selected_point_ids': values['selection_data']},
              }
              selectors = data.setdefault('selector', {})
              selectors['entity_profile'] = {'options': values['profiles']}
              path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          # Regression tests for persistence/profile behavior.
          tests = Path('tests/test_logic.py')
          text = tests.read_text(encoding='utf-8')
          if 'from custom_components.nibe_local.profiles import (' not in text:
              insertion = '''from custom_components.nibe_local.profiles import (\n    DEFAULT_ENTITY_PROFILE,\n    PROFILE_COMPLETE,\n    PROFILE_EXTENDED,\n    PROFILE_INDIVIDUAL,\n    PROFILE_MINIMAL,\n    PROFILE_STANDARD,\n    point_enabled,\n)\n'''
              anchor = 'from custom_components.nibe_local.number import metadata_limits, value_is_representable\n'
              if anchor not in text:
                  raise RuntimeError('test import anchor missing')
              text = text.replace(anchor, anchor + insertion, 1)
          marker = '\ndef test_periodic_hot_water_date_epoch() -> None:\n'
          additions = '''\ndef test_entity_profiles_are_monotonic_for_curated_points() -> None:\n    minimal = {p.point_id for p in POINTS if point_enabled(PROFILE_MINIMAL, p.point_id)}\n    standard = {p.point_id for p in POINTS if point_enabled(PROFILE_STANDARD, p.point_id)}\n    extended = {p.point_id for p in POINTS if point_enabled(PROFILE_EXTENDED, p.point_id)}\n    assert minimal < standard < extended\n    assert DEFAULT_ENTITY_PROFILE == PROFILE_EXTENDED\n\n\ndef test_complete_profile_accepts_unknown_discovered_points() -> None:\n    assert point_enabled(PROFILE_COMPLETE, 999999)\n    assert not point_enabled(PROFILE_EXTENDED, 999999)\n\n\ndef test_individual_profile_uses_only_persisted_ids() -> None:\n    selected = [4, "8", 3096]\n    assert point_enabled(PROFILE_INDIVIDUAL, 4, selected)\n    assert point_enabled(PROFILE_INDIVIDUAL, 8, selected)\n    assert point_enabled(PROFILE_INDIVIDUAL, 3096, selected)\n    assert not point_enabled(PROFILE_INDIVIDUAL, 10, selected)\n\n'''
          if 'test_entity_profiles_are_monotonic_for_curated_points' not in text:
              if marker not in text:
                  raise RuntimeError('test insertion marker missing')
              text = text.replace(marker, additions + marker, 1)
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install homeassistant

      - name: Validate JSON, syntax and tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [Path('hacs.json'), Path('custom_components/nibe_local/manifest.json')]
          paths.extend(Path('custom_components/nibe_local/translations').glob('*.json'))
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY
          python -m compileall -q custom_components/nibe_local tests
          PYTHONPATH="$GITHUB_WORKSPACE" pytest -q

      - name: Commit 0.9.0 and remove one-time workflow
        run: |
          rm .github/workflows/build-090-entity-profiles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nibe_local CHANGELOG.md tests/test_logic.py .github/workflows/build-090-entity-profiles.yml
          git commit -m 'Add configurable entity profiles for 0.9.0'
          git push
