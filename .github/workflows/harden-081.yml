name: Harden 0.8.1

on:
  push:
    paths:
      - '.github/workflows/harden-081.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply security and multi-instance hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # api.py: bounded response bodies and iterative/bounded point normalization.
          replace(
              'custom_components/nibe_local/api.py',
              'import asyncio\nimport socket\nimport ssl\nfrom typing import Any\n',
              'import asyncio\nfrom json import JSONDecodeError, loads\nimport socket\nimport ssl\nfrom typing import Any\n',
          )
          replace(
              'custom_components/nibe_local/api.py',
              'from .const import AUTH_METHOD_BASIC, AUTH_METHOD_HEADER, NIBE_DEVICE_ID\n\n\nasync def async_resolve_host_ip',
              'from .const import AUTH_METHOD_BASIC, AUTH_METHOD_HEADER, NIBE_DEVICE_ID\n\nMAX_RESPONSE_BYTES = 4 * 1024 * 1024\nMAX_NORMALIZE_DEPTH = 64\n\n\nasync def async_resolve_host_ip',
          )
          replace(
              'custom_components/nibe_local/api.py',
              '                if response.status == 204:\n                    return None\n                return await response.json(content_type=None)\n        except NibeAuthError:\n            raise\n        except ClientResponseError as err:',
              '''                if response.status == 204:\n                    return None\n\n                if (\n                    response.content_length is not None\n                    and response.content_length > MAX_RESPONSE_BYTES\n                ):\n                    raise NibeApiError(\n                        f"NIBE API response exceeds {MAX_RESPONSE_BYTES} bytes"\n                    )\n\n                body = bytearray()\n                async for chunk in response.content.iter_chunked(64 * 1024):\n                    if len(body) + len(chunk) > MAX_RESPONSE_BYTES:\n                        raise NibeApiError(\n                            f"NIBE API response exceeds {MAX_RESPONSE_BYTES} bytes"\n                        )\n                    body.extend(chunk)\n\n                try:\n                    return loads(body)\n                except (JSONDecodeError, UnicodeDecodeError) as err:\n                    raise NibeApiError("NIBE API returned invalid JSON") from err\n        except (NibeAuthError, NibeApiError):\n            raise\n        except ClientResponseError as err:''',
          )
          start = '''    @staticmethod\n    def _normalize_points(payload: Any) -> dict[str, Any]:\n        """Normalize NIBE point responses from different firmware/API shapes."""\n        result: dict[str, Any] = {}\n\n        def visit(node: Any) -> None:\n            if isinstance(node, list):\n                for item in node:\n                    visit(item)\n                return\n\n            if not isinstance(node, dict):\n                return\n\n            metadata = node.get("metadata")\n            if isinstance(metadata, dict) and metadata.get("variableId") is not None:\n                point_id = str(metadata["variableId"])\n                result[point_id] = node\n                return\n\n            for wrapper in ("points", "data", "items", "values"):\n                wrapped = node.get(wrapper)\n                if isinstance(wrapped, (dict, list)):\n                    visit(wrapped)\n\n            for key, value in node.items():\n                if isinstance(value, dict):\n                    md = value.get("metadata")\n                    if isinstance(md, dict) and md.get("variableId") is not None:\n                        result[str(md["variableId"])] = value\n                    elif str(key).isdigit() and (\n                        "value" in value or "datavalue" in value or "metadata" in value\n                    ):\n                        result[str(key)] = value\n\n        visit(payload)\n        return result\n'''
          replacement = '''    @staticmethod\n    def _normalize_points(payload: Any) -> dict[str, Any]:\n        """Normalize NIBE point responses with bounded nesting depth."""\n        result: dict[str, Any] = {}\n        stack: list[tuple[Any, int]] = [(payload, 0)]\n        visited: set[int] = set()\n\n        while stack:\n            node, depth = stack.pop()\n            if depth > MAX_NORMALIZE_DEPTH:\n                raise NibeApiError(\n                    f"NIBE point response exceeds nesting depth {MAX_NORMALIZE_DEPTH}"\n                )\n\n            if not isinstance(node, (dict, list)):\n                continue\n\n            node_id = id(node)\n            if node_id in visited:\n                continue\n            visited.add(node_id)\n\n            if isinstance(node, list):\n                stack.extend((item, depth + 1) for item in reversed(node))\n                continue\n\n            metadata = node.get("metadata")\n            if isinstance(metadata, dict) and metadata.get("variableId") is not None:\n                result[str(metadata["variableId"])] = node\n                continue\n\n            for wrapper in ("points", "data", "items", "values"):\n                wrapped = node.get(wrapper)\n                if isinstance(wrapped, (dict, list)):\n                    stack.append((wrapped, depth + 1))\n\n            for key, value in node.items():\n                if not isinstance(value, dict):\n                    continue\n                md = value.get("metadata")\n                if isinstance(md, dict) and md.get("variableId") is not None:\n                    result[str(md["variableId"])] = value\n                elif str(key).isdigit() and (\n                    "value" in value or "datavalue" in value or "metadata" in value\n                ):\n                    result[str(key)] = value\n\n        return result\n'''
          replace('custom_components/nibe_local/api.py', start, replacement)

          # coordinator.py: per-config-entry namespace, including notifications.
          replace(
              'custom_components/nibe_local/coordinator.py',
              '        command_poll_delay_ms: int = 1000,\n        device_name: str = "NIBE Local REST API",\n    ) -> None:',
              '        command_poll_delay_ms: int = 1000,\n        device_name: str = "NIBE Local REST API",\n        instance_id: str | None = None,\n    ) -> None:',
          )
          replace(
              'custom_components/nibe_local/coordinator.py',
              '        self.device_name = device_name\n        self._fallback_failure_streak = 0',
              '        self.device_name = device_name\n        self.instance_id = instance_id or api.device_id\n        self._fallback_failure_streak = 0',
          )
          replace(
              'custom_components/nibe_local/coordinator.py',
              '        return f"{DOMAIN}_{self.api.device_id}_auth"',
              '        return f"{DOMAIN}_{self.instance_id}_auth"',
          )
          replace(
              'custom_components/nibe_local/coordinator.py',
              '        return f"{DOMAIN}_{self.api.device_id}_connection"',
              '        return f"{DOMAIN}_{self.instance_id}_connection"',
          )

          # entity.py: one central unique-id helper.
          replace(
              'custom_components/nibe_local/entity.py',
              'def coordinator_device_info(coordinator: NibeCoordinator) -> DeviceInfo:\n',
              'def entity_unique_id(coordinator: NibeCoordinator, suffix: str | int) -> str:\n    """Return a config-entry-scoped stable entity unique ID."""\n    return f"{coordinator.instance_id}_{suffix}"\n\n\ndef coordinator_device_info(coordinator: NibeCoordinator) -> DeviceInfo:\n',
          )
          replace(
              'custom_components/nibe_local/entity.py',
              '        self._attr_unique_id = f"{coordinator.api.device_id}_{definition.point_id}"',
              '        self._attr_unique_id = entity_unique_id(coordinator, definition.point_id)',
          )

          # Update the special/non-point entities to use the same namespace.
          for path in [
              'custom_components/nibe_local/sensor.py',
              'custom_components/nibe_local/binary_sensor.py',
              'custom_components/nibe_local/select.py',
              'custom_components/nibe_local/switch.py',
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if path.endswith('sensor.py'):
                  text = text.replace(
                      'from .entity import NibePointEntity, coordinator_device_info, raw_value, scaled_value',
                      'from .entity import (\n    NibePointEntity,\n    coordinator_device_info,\n    entity_unique_id,\n    raw_value,\n    scaled_value,\n)',
                  )
              elif path.endswith('binary_sensor.py'):
                  text = text.replace(
                      'from .entity import NibePointEntity, coordinator_device_info, raw_value',
                      'from .entity import NibePointEntity, coordinator_device_info, entity_unique_id, raw_value',
                  )
              elif path.endswith('select.py'):
                  text = text.replace(
                      'from .entity import NibePointEntity, coordinator_device_info, raw_value',
                      'from .entity import NibePointEntity, coordinator_device_info, entity_unique_id, raw_value',
                  )
              else:
                  text = text.replace(
                      'from .entity import NibePointEntity, raw_value',
                      'from .entity import NibePointEntity, entity_unique_id, raw_value',
                  )
              replacements = {
                  'f"{coordinator.api.device_id}_notifications"': 'entity_unique_id(coordinator, "notifications")',
                  'f"{coordinator.api.device_id}_last_connection_error"': 'entity_unique_id(coordinator, "last_connection_error")',
                  'f"{coordinator.api.device_id}_api_reachable"': 'entity_unique_id(coordinator, "api_reachable")',
                  'f"{coordinator.api.device_id}_fallback_active"': 'entity_unique_id(coordinator, "fallback_active")',
                  'f"{coordinator.api.device_id}_smart_mode"': 'entity_unique_id(coordinator, "smart_mode")',
                  'f"{coordinator.api.device_id}_more_hot_water"': 'entity_unique_id(coordinator, "more_hot_water")',
                  'f"{coordinator.api.device_id}_ventilation_plus"': 'entity_unique_id(coordinator, "ventilation_plus")',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if 'coordinator.api.device_id}_' in text:
                  raise RuntimeError(f'Unmigrated special unique ID in {path}')
              p.write_text(text, encoding='utf-8')

          # __init__.py: migrate existing registry unique IDs in-place before platform setup.
          replace(
              'custom_components/nibe_local/__init__.py',
              'from homeassistant.helpers.aiohttp_client import async_get_clientsession\n',
              'from homeassistant.helpers.aiohttp_client import async_get_clientsession\nfrom homeassistant.helpers import entity_registry as er\n',
          )
          replace(
              'custom_components/nibe_local/__init__.py',
              '    PLATFORMS,\n)',
              '    PLATFORMS,\n    DOMAIN,\n)',
          )
          insert_before = '''async def async_setup_entry(hass: HomeAssistant, entry: ConfigEntry) -> bool:\n'''
          migration = '''async def _async_migrate_entity_unique_ids(\n    hass: HomeAssistant, entry: ConfigEntry\n) -> None:\n    """Move legacy device-id unique IDs to a config-entry-scoped namespace."""\n    registry = er.async_get(hass)\n    prefix = f"{entry.entry_id}_"\n    legacy_prefix = "0_"\n\n    for registry_entry in er.async_entries_for_config_entry(registry, entry.entry_id):\n        old_unique_id = registry_entry.unique_id\n        if old_unique_id.startswith(prefix) or not old_unique_id.startswith(legacy_prefix):\n            continue\n        new_unique_id = f"{prefix}{old_unique_id[len(legacy_prefix):]}"\n        existing_entity_id = registry.async_get_entity_id(\n            registry_entry.domain, registry_entry.platform, new_unique_id\n        )\n        if existing_entity_id and existing_entity_id != registry_entry.entity_id:\n            continue\n        registry.async_update_entity(\n            registry_entry.entity_id, new_unique_id=new_unique_id\n        )\n\n\n'''
          replace('custom_components/nibe_local/__init__.py', insert_before, migration + insert_before)
          replace(
              'custom_components/nibe_local/__init__.py',
              '        device_name=entry.title or "NIBE Local REST API",\n    )',
              '        device_name=entry.title or "NIBE Local REST API",\n        instance_id=entry.entry_id,\n    )',
          )
          replace(
              'custom_components/nibe_local/__init__.py',
              '    await coordinator.async_config_entry_first_refresh()\n\n    entry.runtime_data = coordinator',
              '    await coordinator.async_config_entry_first_refresh()\n    await _async_migrate_entity_unique_ids(hass, entry)\n\n    entry.runtime_data = coordinator',
          )

          # Regression tests.
          tests = Path('tests/test_logic.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace('import json\nfrom pathlib import Path\n', 'import json\nfrom pathlib import Path\nfrom types import SimpleNamespace\n\nimport pytest\n')
          text = text.replace(
              'from custom_components.nibe_local.api import NibeLocalApi',
              'from custom_components.nibe_local.api import (\n    MAX_NORMALIZE_DEPTH,\n    MAX_RESPONSE_BYTES,\n    NibeApiError,\n    NibeLocalApi,\n)',
          )
          text = text.replace(
              'from custom_components.nibe_local.entity import scaled_value, to_raw',
              'from custom_components.nibe_local.entity import entity_unique_id, scaled_value, to_raw',
          )
          marker = '''def test_periodic_hot_water_date_epoch() -> None:\n'''
          additions = '''def test_normalize_points_rejects_excessive_nesting() -> None:\n    point = {\n        "metadata": {"variableId": 4},\n        "value": {"integerValue": 222, "stringValue": ""},\n    }\n    payload = point\n    for _ in range(MAX_NORMALIZE_DEPTH + 1):\n        payload = {"data": payload}\n\n    with pytest.raises(NibeApiError, match="nesting depth"):\n        NibeLocalApi._normalize_points(payload)\n\n\ndef test_normalize_points_handles_cycles_without_recursing_forever() -> None:\n    payload: dict = {}\n    payload["data"] = payload\n    assert NibeLocalApi._normalize_points(payload) == {}\n\n\ndef test_response_size_limit_is_bounded() -> None:\n    assert MAX_RESPONSE_BYTES == 4 * 1024 * 1024\n\n\ndef test_entity_unique_ids_are_scoped_per_config_entry() -> None:\n    first = SimpleNamespace(instance_id="entry-one")\n    second = SimpleNamespace(instance_id="entry-two")\n    assert entity_unique_id(first, 4) == "entry-one_4"\n    assert entity_unique_id(second, 4) == "entry-two_4"\n    assert entity_unique_id(first, 4) != entity_unique_id(second, 4)\n\n\n'''
          if marker not in text:
              raise RuntimeError('test insertion marker missing')
          text = text.replace(marker, additions + marker)
          tests.write_text(text, encoding='utf-8')

          # Changelog: document the 0.8.1 hardening separately from 0.8.0.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '## 0.8.0 (in Entwicklung)\n'
          section = '''## 0.8.1\n\n- Sicherheits-Härtung der REST-Antwortverarbeitung: JSON-Antworten sind auf 4 MiB begrenzt und übergroße Antworten werden kontrolliert als API-Fehler behandelt.\n- Die Normalisierung von `/points` arbeitet iterativ mit maximaler Verschachtelungstiefe und kann dadurch nicht mehr durch extrem tief verschachtelte Antworten einen `RecursionError` auslösen.\n- Entity-Unique-IDs und Persistent-Notification-IDs sind jetzt pro Config Entry getrennt, sodass mehrere NIBE-Anlagen keine Kollisionen mehr verursachen. Bestehende Entity-IDs bleiben durch eine Registry-Migration erhalten.\n- Regressionstests für Verschachtelungslimits, zyklische Strukturen, Response-Limit und Multi-Instance-Unique-IDs ergänzt.\n\n## 0.8.0\n'''
          if heading not in text:
              raise RuntimeError('0.8.0 changelog heading missing')
          changelog.write_text(text.replace(heading, section, 1), encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install homeassistant

      - name: Validate syntax and regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q custom_components/nibe_local tests
          pytest -q

      - name: Commit hardening and remove one-time workflow
        run: |
          rm .github/workflows/harden-081.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nibe_local/api.py \
                  custom_components/nibe_local/coordinator.py \
                  custom_components/nibe_local/entity.py \
                  custom_components/nibe_local/__init__.py \
                  custom_components/nibe_local/sensor.py \
                  custom_components/nibe_local/binary_sensor.py \
                  custom_components/nibe_local/select.py \
                  custom_components/nibe_local/switch.py \
                  tests/test_logic.py CHANGELOG.md \
                  .github/workflows/harden-081.yml
          git commit -m 'Harden REST handling and multi-instance IDs for 0.8.1'
          git push
