name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version aus Manifest lesen
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/nibe_local/manifest.json').read_text(encoding='utf-8'))
          print(manifest['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release nur bei neuer Version erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits."
            exit 0
          fi

          RELEASE_ARGS=()
          if [ "$VERSION" = "0.10.0" ] || [ "$VERSION" = "0.10.1" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG Beta" \
            --generate-notes \
            "${RELEASE_ARGS[@]}"
