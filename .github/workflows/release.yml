name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version aus Manifest lesen
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/nibe_local/manifest.json').read_text(encoding='utf-8'))
          print(manifest['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release erstellen oder v0.10.1 veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # One-time user-authorized replacement of v1.0.1; do not touch
            # any later manually moved or otherwise updated release tag.
            if [ "$VERSION" = "1.0.1" ]; then
              EXPECTED_TAG_SHA="c50af217ed71356108fb23470c13dcf44b94881d"
              CURRENT_TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
              if [ "$CURRENT_TAG_SHA" = "$EXPECTED_TAG_SHA" ]; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git tag -f "$TAG" "$GITHUB_SHA"
                git push origin "refs/tags/$TAG" --force-with-lease="refs/tags/$TAG:$EXPECTED_TAG_SHA"
                RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
                EXISTING_NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.body')
                UPDATED_NOTES=$(printf '%s\n\n%s\n' "$EXISTING_NOTES" 'Update v1.0.1: Verzögerte REST-Schreibbestätigung für schreibbare Switch-, Select- und Number-Entitäten inklusive AUX 22077 und HU-Pumpenmodi. Das gewünschte UI-Ergebnis bleibt bis zur NIBE-Bestätigung sichtbar; bei nicht bestätigter Änderung wird der reale REST-Wert angezeigt. Nach HACS-Update v1.0.1 erneut herunterladen und Home Assistant neu starten.')
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                  -f target_commitish="$GITHUB_SHA" -F prerelease=false \
                  -f make_latest=true -f body="$UPDATED_NOTES" >/dev/null
                echo "Existing v1.0.1 tag and release updated successfully."
              else
                echo "v1.0.1 tag already replaced or modified: $CURRENT_TAG_SHA. Skipping."
              fi
              exit 0
            fi
            if [ "$VERSION" = "0.14.3" ]; then
              CURRENT_TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
              if [ "$CURRENT_TAG_SHA" = "abfe237e8803184d5970b7db24c1bf79a7cc1e7d" ]; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git tag -f "$TAG" "$GITHUB_SHA"
                git push origin "refs/tags/$TAG" --force-with-lease="refs/tags/$TAG:$CURRENT_TAG_SHA"
                RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                  -f target_commitish="$GITHUB_SHA" -F prerelease=false -f make_latest=true \
                  -f body='GP1-Betriebsmodi korrigiert: 4651 = Betriebsmodus HU-Pumpe GP1 Heizung; 4821 = Betriebsmodus HU-Pumpe GP1 Kühlung. Beide sind schreibbare Auswahlfelder: Periodisch (0) / Auto (1). Dashboard und Automationen auf select umstellen. In HACS bereits installierte v0.14.3 erneut herunterladen und Home Assistant neu starten.' >/dev/null
              fi
              exit 0
            fi
            if [ "$VERSION" != "0.10.1" ]; then
              echo "Release $TAG existiert bereits."
              exit 0
            fi

            echo "Bestehendes v0.10.1-Prerelease auf den aktuellen Stand verschieben und veröffentlichen."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force

            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f name="$TAG" \
              -F prerelease=false \
              -f make_latest=true \
              -f target_commitish="$GITHUB_SHA" >/dev/null
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
