name: Verify 0.9.0

on:
  push:
    paths:
      - '.github/workflows/verify-090.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant-version: ['2024.12.0', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        env:
          HA_VERSION: ${{ matrix.homeassistant-version }}
        run: |
          python -m pip install --upgrade pip pytest
          if [ "$HA_VERSION" = "latest" ]; then
            python -m pip install homeassistant
          else
            python -m pip install "homeassistant==$HA_VERSION"
          fi
      - name: Run validation
        run: |
          python -m compileall -q custom_components/nibe_local tests
          PYTHONPATH="$GITHUB_WORKSPACE" pytest -q

  cleanup:
    needs: verify
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time verification workflow
        run: |
          rm .github/workflows/verify-090.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-090.yml
          git commit -m 'Remove one-time 0.9.0 verification workflow'
          git push
