name: Apply brand icons
on:
  push:
    paths:
      - '.github/workflows/apply-brand-icons.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build icon files
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import base64

          encoded = (
              Path('.github/icon_part1.txt').read_text().strip()
              + Path('.github/icon_part2.txt').read_text().strip()
          )
          raw = base64.b64decode(encoded, validate=True)
          src = Path('/tmp/nibe-icon.png')
          src.write_bytes(raw)
          base = Image.open(src).convert('RGBA')
          assert base.size == (256, 256), base.size
          assert base.getextrema()[3][0] < 255, 'Icon has no transparency'
          x2 = base.resize((512, 512), Image.Resampling.LANCZOS)
          brand = Path('custom_components/nibe_local/brand')
          base.save(brand / 'icon.png', optimize=True)
          base.save(brand / 'dark_icon.png', optimize=True)
          x2.save(brand / 'icon@2x.png', optimize=True)
          x2.save(brand / 'dark_icon@2x.png', optimize=True)

          assert (brand / 'icon.png').read_bytes() == (brand / 'dark_icon.png').read_bytes()
          assert (brand / 'icon@2x.png').read_bytes() == (brand / 'dark_icon@2x.png').read_bytes()
          assert Image.open(brand / 'icon.png').size == (256, 256)
          assert Image.open(brand / 'icon@2x.png').size == (512, 512)
      - name: Commit icons only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nibe_local/brand/icon.png custom_components/nibe_local/brand/icon@2x.png custom_components/nibe_local/brand/dark_icon.png custom_components/nibe_local/brand/dark_icon@2x.png
          git commit -m 'Replace brand icons with unified transparent icon'
          git push
