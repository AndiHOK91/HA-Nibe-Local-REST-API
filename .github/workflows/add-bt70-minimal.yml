name: Add BT70 and compressor frequency to Minimal

on:
  push:
    paths:
      - '.github/workflows/add-bt70-minimal.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('custom_components/nibe_local/const.py')
          text = p.read_text(encoding='utf-8')
          anchor = '    PointDef(12, "hot_water_charge_bt6", "hot_water"),\n'
          addition = '    PointDef(116, "hot_water_outlet_bt70", "hot_water"),\n'
          if addition not in text:
              if anchor not in text:
                  raise RuntimeError('BT6 anchor not found')
              text = text.replace(anchor, anchor + addition)
          p.write_text(text, encoding='utf-8')

          p = Path('custom_components/nibe_local/profiles.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '        12,    # Hot-water charge BT6\n        158,   # Room temperature BT50\n',
              '        12,    # Hot-water charge BT6\n        116,   # Hot-water outlet BT70\n        158,   # Room temperature BT50\n'
          )
          text = text.replace(
              '        2500,  # Compressor status\n        4064,  # Operating mode status\n',
              '        2500,  # Compressor status\n        3096,  # Compressor frequency\n        4064,  # Operating mode status\n'
          )
          p.write_text(text, encoding='utf-8')

          for lang, name in (
              ('de', 'Brauchwasseraustritt (BT70)'),
              ('en', 'Hot water outlet (BT70)'),
          ):
              path = Path(f'custom_components/nibe_local/translations/{lang}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              sensors = data['entity']['sensor']
              rebuilt = {}
              inserted = False
              for key, value in sensors.items():
                  rebuilt[key] = value
                  if key == 'hot_water_charge_bt6':
                      rebuilt['hot_water_outlet_bt70'] = {'name': name}
                      inserted = True
              if not inserted:
                  rebuilt['hot_water_outlet_bt70'] = {'name': name}
              data['entity']['sensor'] = rebuilt
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = '''- Brauchwassertemperaturen\n- Volumenstrom\n- Gradminuten\n- Betriebspriorität und Betriebsmodus\n- Heizungsumwälzpumpe\n- Verdichterstatus, -frequenz und -leistung\n- Heizung/Kühlung zulassen\n- Brauchwasserbedarf\n- Mehr Brauchwasser\n'''
          new = '''- Außentemperatur\n- Vorlauf und Rücklauf\n- Raumtemperatur\n- Brauchwassertemperaturen BT7, BT6 und BT70\n- Betriebspriorität und Betriebsmodus\n- Verdichterstatus und Verdichterfrequenz\n'''
          if old in text:
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_logic.py')
          text = p.read_text(encoding='utf-8')
          marker = '\ndef test_minimal_profile_core_contract() -> None:\n'
          if marker not in text:
              text += '''\n\ndef test_minimal_profile_core_contract() -> None:\n    from custom_components.nibe_local.profiles import MINIMAL_POINT_IDS\n\n    expected = {4, 8, 10, 11, 12, 116, 158, 1758, 2500, 3096, 4064}\n    assert MINIMAL_POINT_IDS == expected\n\n\ndef test_bt70_is_known_read_only_sensor() -> None:\n    definitions = {definition.point_id: definition for definition in POINTS}\n    bt70 = definitions[116]\n    assert bt70.key == "hot_water_outlet_bt70"\n    assert bt70.group == "hot_water"\n    assert bt70.platform == "sensor"\n'''
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m json.tool custom_components/nibe_local/translations/de.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/en.json >/dev/null
          python -m pip install --upgrade pip pytest
          python -m pip install homeassistant
          pytest -q

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          rm -f .github/workflows/add-bt70-minimal.yml
          git add -A
          git commit -m 'Add BT70 and compressor frequency to Minimal profile'
          git push
