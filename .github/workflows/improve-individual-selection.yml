name: Improve individual entity selection

on:
  push:
    paths:
      - '.github/workflows/improve-individual-selection.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Update individual selection UX
        run: |
          echo '' | base64 -d > /tmp/update_individual_selection.py
          python /tmp/update_individual_selection.py
          python -m json.tool custom_components/nibe_local/manifest.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/de.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/en.json >/dev/null
          python -m compileall -q custom_components/nibe_local tests

      - name: Run regression tests on Home Assistant 2024.12
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install 'homeassistant==2024.12.0'
          PYTHONPATH="$GITHUB_WORKSPACE" pytest -q

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          rm -f .github/workflows/improve-individual-selection.yml
          find custom_components tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git add custom_components/nibe_local/config_flow.py custom_components/nibe_local/manifest.json custom_components/nibe_local/translations/de.json custom_components/nibe_local/translations/en.json tests/test_logic.py README.md CHANGELOG.md .github/workflows/improve-individual-selection.yml
          git commit -m 'Improve individual entity selection UX'
          git push
