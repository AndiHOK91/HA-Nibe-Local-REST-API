name: Update README diagnostics
on:
  push:
    paths:
      - '.github/workflows/update-readme-diagnostics.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          old = '''Der interne Zeitpunkt des letzten erfolgreichen Polls wird nicht fortlaufend als Recorder-relevantes Entity-Attribut veröffentlicht, um unnötige Zustandsänderungen zu vermeiden.\n\n---'''
          new = '''Der interne Zeitpunkt des letzten erfolgreichen Polls wird nicht fortlaufend als Recorder-relevantes Entity-Attribut veröffentlicht, um unnötige Zustandsänderungen zu vermeiden.\n\n### Diagnosedaten herunterladen\n\nDie Integration unterstützt die Home-Assistant-Funktion **Diagnosedaten herunterladen**. Diese Datei ist insbesondere für Support und Tests mit anderen NIBE-S-Series-Geräten hilfreich.\n\nEnthalten sind unter anderem:\n\n- gewähltes Entitätsprofil und Benennungsmodus\n- Polling- und TLS-Konfiguration ohne Netzwerkziel\n- Verbindungs- und Fallback-Status\n- Modell-/Firmwareinformationen, sofern die lokale API sie in geeigneten Feldern liefert\n- verfügbare und aktivierte Variable-IDs\n- ungefährliche Punkt-Metadaten wie Beschreibung, Einheit, Datentyp und Schreibbarkeitskennzeichen\n- Anzahl aktiver Alarme, jedoch nicht deren Texte\n\nAus Datenschutz- und Sicherheitsgründen werden bewusst **nicht** exportiert:\n\n- Hostname oder IP-Adresse der NIBE\n- Benutzername und Passwort\n- Authorization-Header oder andere Zugangsdaten\n- Seriennummern\n- aktuelle Mess- und Einstellwerte der NIBE-Punkte\n- Alarmtexte\n\nDamit kann eine Diagnose beispielsweise bei unbekannten Punktbelegungen oder abweichenden Firmwareständen geteilt werden, ohne die komplette lokale API-Antwort offenzulegen.\n\n---'''
          if old not in text:
              raise SystemExit('Diagnostics anchor not found')
          text = text.replace(old, new, 1)

          old_tests = '''- Entitätsbenennung\n- Profilzählung anhand tatsächlich verfügbarer Punkte'''
          new_tests = '''- Entitätsbenennung\n- Profilzählung anhand tatsächlich verfügbarer Punkte\n- Config-Entry-Versionssprünge nur mit Migrationshandler\n- Import-Smoke-Test aller deklarierten Plattformen\n- Diagnosedaten auf unbeabsichtigte Preisgabe sensibler Daten\n- Ruff-Prüfung auf undefinierte Python-Namen (`F821`) in der CI'''
          if old_tests not in text:
              raise SystemExit('Tests anchor not found')
          text = text.replace(old_tests, new_tests, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit README
        run: |
          grep -Fq 'Diagnosedaten herunterladen' README.md
          grep -Fq 'Ruff-Prüfung auf undefinierte Python-Namen' README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Document privacy-conscious diagnostics and CI safeguards'
          git push
