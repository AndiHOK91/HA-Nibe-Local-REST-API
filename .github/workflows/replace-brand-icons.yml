name: Replace brand icons
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/replace-brand-icons.yml'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build matching icon variants
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import base64

          encoded = ''''''
          raw = base64.b64decode(encoded)
          tmp = Path('/tmp/nibe_icon.png')
          tmp.write_bytes(raw)
          base = Image.open(tmp).convert('RGBA')
          if base.size != (256, 256):
              base = base.resize((256, 256), Image.Resampling.LANCZOS)
          x2 = base.resize((512, 512), Image.Resampling.LANCZOS)
          brand = Path('custom_components/nibe_local/brand')
          for name in ('icon.png', 'dark_icon.png'):
              base.save(brand / name, optimize=True)
          for name in ('icon@2x.png', 'dark_icon@2x.png'):
              x2.save(brand / name, optimize=True)
      - name: Verify icons
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          brand = Path('custom_components/nibe_local/brand')
          expected = {
              'icon.png': (256, 256),
              'dark_icon.png': (256, 256),
              'icon@2x.png': (512, 512),
              'dark_icon@2x.png': (512, 512),
          }
          for name, size in expected.items():
              image = Image.open(brand / name)
              assert image.size == size, (name, image.size)
              assert image.mode in ('RGBA', 'P'), (name, image.mode)
          assert (brand / 'icon.png').read_bytes() == (brand / 'dark_icon.png').read_bytes()
          assert (brand / 'icon@2x.png').read_bytes() == (brand / 'dark_icon@2x.png').read_bytes()
      - name: Commit icon replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nibe_local/brand/icon.png custom_components/nibe_local/brand/icon@2x.png custom_components/nibe_local/brand/dark_icon.png custom_components/nibe_local/brand/dark_icon@2x.png
          git commit -m 'Replace brand icons with unified transparent icon'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git pull --rebase
          git rm .github/workflows/replace-brand-icons.yml
          git commit -m 'Remove one-time brand icon workflow'
          git push
