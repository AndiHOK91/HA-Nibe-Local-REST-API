name: Update renamed repository links

on:
  push:
    paths:
      - '.github/workflows/update-renamed-repository-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old repository references
        env:
          WORKFLOW_PATH: .github/workflows/update-renamed-repository-links.yml
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path('.')
          workflow = Path(os.environ['WORKFLOW_PATH'])
          old = 'AndiO91/HomeAssistant-Local-REST-API'
          new = 'AndiO91/HA-Nibe-Local-REST-API'
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(str(path))

          if not changed:
              raise SystemExit('No old repository references found')

          print('Updated:')
          for path in changed:
              print(f'  {path}')

          remaining = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in text:
                  remaining.append(str(path))

          if remaining:
              raise SystemExit(f'Old repository references remain: {remaining}')
          PY

          python -m json.tool custom_components/nibe_local/manifest.json >/dev/null

      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          rm -f .github/workflows/update-renamed-repository-links.yml
          git add -u
          git commit -m 'Update repository references after rename'
          git push
