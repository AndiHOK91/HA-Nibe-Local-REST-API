name: Add 0.9.0 entity naming

on:
  push:
    paths:
      - '.github/workflows/add-090-entity-naming.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply entity naming feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Constants.
          replace(
              'custom_components/nibe_local/const.py',
              'CONF_ENTITY_PROFILE = "entity_profile"\nCONF_SELECTED_POINT_IDS = "selected_point_ids"\n',
              'CONF_ENTITY_PROFILE = "entity_profile"\nCONF_SELECTED_POINT_IDS = "selected_point_ids"\nCONF_ENTITY_NAMING = "entity_naming"\n\nENTITY_NAMING_HOME_ASSISTANT = "home_assistant"\nENTITY_NAMING_LOCAL_API = "local_api"\nENTITY_NAMING_TECHNICAL = "technical"\nENTITY_NAMING_MODES = (\n    ENTITY_NAMING_HOME_ASSISTANT,\n    ENTITY_NAMING_LOCAL_API,\n    ENTITY_NAMING_TECHNICAL,\n)\nDEFAULT_ENTITY_NAMING = ENTITY_NAMING_HOME_ASSISTANT\n'
          )

          # Profile counts for the actually discovered device.
          p = Path('custom_components/nibe_local/profiles.py')
          text = p.read_text(encoding='utf-8')
          text += '''\n\ndef profile_counts(available_ids: Iterable[object]) -> dict[str, int]:\n    """Return how many discovered variables are active in each automatic profile."""\n    available = normalize_selected_ids(available_ids)\n    return {\n        PROFILE_MINIMAL: len(available & MINIMAL_POINT_IDS),\n        PROFILE_STANDARD: len(available & STANDARD_POINT_IDS),\n        PROFILE_EXTENDED: len(available & KNOWN_POINT_IDS),\n        PROFILE_COMPLETE: len(available),\n        PROFILE_INDIVIDUAL: len(available),\n    }\n'''
          p.write_text(text, encoding='utf-8')

          # Coordinator stores the selected naming mode.
          replace(
              'custom_components/nibe_local/coordinator.py',
              '        entity_profile: str = DEFAULT_ENTITY_PROFILE,\n        selected_point_ids=None,\n    ) -> None:',
              '        entity_profile: str = DEFAULT_ENTITY_PROFILE,\n        selected_point_ids=None,\n        entity_naming: str = "home_assistant",\n    ) -> None:'
          )
          replace(
              'custom_components/nibe_local/coordinator.py',
              '        self.selected_point_ids = tuple(selected_point_ids or ())\n',
              '        self.selected_point_ids = tuple(selected_point_ids or ())\n        self.entity_naming = entity_naming\n'
          )

          # Pass naming mode from persisted config/options into the coordinator.
          replace(
              'custom_components/nibe_local/__init__.py',
              '    CONF_ENTITY_PROFILE,\n    CONF_SCAN_INTERVAL,',
              '    CONF_ENTITY_PROFILE,\n    CONF_ENTITY_NAMING,\n    CONF_SCAN_INTERVAL,'
          )
          replace(
              'custom_components/nibe_local/__init__.py',
              '    DEFAULT_COMMAND_POLL_DELAY_MS,\n    DEFAULT_PORT,',
              '    DEFAULT_COMMAND_POLL_DELAY_MS,\n    DEFAULT_ENTITY_NAMING,\n    DEFAULT_PORT,'
          )
          replace(
              'custom_components/nibe_local/__init__.py',
              '        selected_point_ids=data.get(CONF_SELECTED_POINT_IDS, ()),\n    )',
              '        selected_point_ids=data.get(CONF_SELECTED_POINT_IDS, ()),\n        entity_naming=data.get(CONF_ENTITY_NAMING, DEFAULT_ENTITY_NAMING),\n    )'
          )

          # Naming helpers and known point entity behavior.
          replace(
              'custom_components/nibe_local/entity.py',
              'from .const import DOMAIN, PointDef\n',
              'from .const import (\n    DOMAIN,\n    ENTITY_NAMING_HOME_ASSISTANT,\n    ENTITY_NAMING_LOCAL_API,\n    ENTITY_NAMING_TECHNICAL,\n    PointDef,\n)\n'
          )
          insert = '''\n\ndef local_api_point_name(point: dict[str, Any]) -> str | None:\n    """Return the human-readable name supplied by the local REST API."""\n    metadata = point.get("metadata") or {}\n    for value in (\n        point.get("description"),\n        point.get("name"),\n        metadata.get("description"),\n        metadata.get("name"),\n    ):\n        cleaned = _clean(str(value)) if value not in (None, "") else ""\n        if cleaned:\n            return cleaned\n    return None\n\n\ndef configured_point_name(\n    mode: str, point: dict[str, Any], definition: PointDef\n) -> str | None:\n    """Return an explicit point name for non-HA naming modes."""\n    if mode == ENTITY_NAMING_HOME_ASSISTANT:\n        return None\n    api_name = local_api_point_name(point)\n    fallback = definition.key.replace("_", " ")\n    base = api_name or fallback\n    if mode == ENTITY_NAMING_TECHNICAL:\n        return f"{base} [ID {definition.point_id}]"\n    if mode == ENTITY_NAMING_LOCAL_API:\n        return base\n    return None\n'''
          replace(
              'custom_components/nibe_local/entity.py',
              '\ndef point_value(point: dict[str, Any]) -> dict[str, Any]:\n',
              insert + '\n\ndef point_value(point: dict[str, Any]) -> dict[str, Any]:\n'
          )
          replace(
              'custom_components/nibe_local/entity.py',
              '        self._attr_unique_id = entity_unique_id(coordinator, definition.point_id)\n        self._attr_translation_key = definition.key\n',
              '        self._attr_unique_id = entity_unique_id(coordinator, definition.point_id)\n        explicit_name = configured_point_name(\n            coordinator.entity_naming, coordinator.point(definition.point_id) or {}, definition\n        )\n        if explicit_name is None:\n            self._attr_translation_key = definition.key\n        else:\n            self._attr_translation_key = None\n            self._attr_name = explicit_name\n'
          )

          # Unknown/discovered generic sensors: local API is the only semantic source;
          # technical mode appends a stable variable ID.
          replace(
              'custom_components/nibe_local/sensor.py',
              'from .entity import (\n    NibePointEntity,\n    coordinator_device_info,',
              'from .entity import (\n    NibePointEntity,\n    coordinator_device_info,\n    local_api_point_name,'
          )
          old_name = '''    @property\n    def name(self) -> str:\n        point = self.point\n        metadata = point.get("metadata") or {}\n        description = (\n            point.get("description")\n            or point.get("name")\n            or metadata.get("description")\n            or metadata.get("name")\n        )\n        if description:\n            return str(description).replace("\\u00ad", "").strip()\n        return f"NIBE Variable {self.point_id}"\n'''
          new_name = '''    @property\n    def name(self) -> str:\n        base = local_api_point_name(self.point) or f"Local API variable {self.point_id}"\n        if self.coordinator.entity_naming == "technical":\n            return f"{base} [ID {self.point_id}]"\n        return base\n'''
          replace('custom_components/nibe_local/sensor.py', old_name, new_name)

          # Config flow imports/modes.
          replace(
              'custom_components/nibe_local/config_flow.py',
              '    CONF_COMMAND_POLL_DELAY_MS,\n    CONF_ENTITY_PROFILE,',
              '    CONF_COMMAND_POLL_DELAY_MS,\n    CONF_ENTITY_NAMING,\n    CONF_ENTITY_PROFILE,'
          )
          replace(
              'custom_components/nibe_local/config_flow.py',
              '    DEFAULT_COMMAND_POLL_DELAY_MS,\n    DEFAULT_PORT,',
              '    DEFAULT_COMMAND_POLL_DELAY_MS,\n    DEFAULT_ENTITY_NAMING,\n    DEFAULT_PORT,'
          )
          replace(
              'custom_components/nibe_local/config_flow.py',
              '    DOMAIN,\n    MIN_SCAN_INTERVAL,',
              '    DOMAIN,\n    ENTITY_NAMING_MODES,\n    MIN_SCAN_INTERVAL,'
          )
          replace(
              'custom_components/nibe_local/config_flow.py',
              '    PROFILE_INDIVIDUAL,\n    normalize_selected_ids,',
              '    PROFILE_INDIVIDUAL,\n    normalize_selected_ids,\n    profile_counts,'
          )
          replace(
              'custom_components/nibe_local/config_flow.py',
              '''def _entity_profile_selector() -> SelectSelector:\n    return SelectSelector(\n        SelectSelectorConfig(\n            options=list(ENTITY_PROFILES),\n            translation_key="entity_profile",\n        )\n    )\n\n\n''',
              '''def _entity_profile_selector() -> SelectSelector:\n    return SelectSelector(\n        SelectSelectorConfig(\n            options=list(ENTITY_PROFILES),\n            translation_key="entity_profile",\n        )\n    )\n\n\ndef _entity_naming_selector() -> SelectSelector:\n    return SelectSelector(\n        SelectSelectorConfig(\n            options=list(ENTITY_NAMING_MODES),\n            translation_key="entity_naming",\n        )\n    )\n\n\n'''
          )
          replace(
              'custom_components/nibe_local/config_flow.py',
              '    ] = _entity_profile_selector()\n    return vol.Schema(fields)',
              '    ] = _entity_profile_selector()\n    fields[\n        vol.Required(\n            CONF_ENTITY_NAMING,\n            default=current.get(CONF_ENTITY_NAMING, DEFAULT_ENTITY_NAMING),\n        )\n    ] = _entity_naming_selector()\n    return vol.Schema(fields)'
          )

          # Setup profile screen now also stores naming and displays per-device counts.
          replace(
              'custom_components/nibe_local/config_flow.py',
              '            profile = str(user_input[CONF_ENTITY_PROFILE])\n            self._pending_data[CONF_ENTITY_PROFILE] = profile\n',
              '            profile = str(user_input[CONF_ENTITY_PROFILE])\n            self._pending_data[CONF_ENTITY_PROFILE] = profile\n            self._pending_data[CONF_ENTITY_NAMING] = str(\n                user_input.get(CONF_ENTITY_NAMING, DEFAULT_ENTITY_NAMING)\n            )\n'
          )
          old_form = '''        return self.async_show_form(\n            step_id="entity_profile",\n            data_schema=vol.Schema(\n                {\n                    vol.Required(\n                        CONF_ENTITY_PROFILE,\n                        default=DEFAULT_ENTITY_PROFILE,\n                    ): _entity_profile_selector()\n                }\n            ),\n        )\n'''
          new_form = '''        points = self._available_points or {}\n        counts = profile_counts(points.keys())\n        return self.async_show_form(\n            step_id="entity_profile",\n            data_schema=vol.Schema(\n                {\n                    vol.Required(\n                        CONF_ENTITY_PROFILE,\n                        default=DEFAULT_ENTITY_PROFILE,\n                    ): _entity_profile_selector(),\n                    vol.Required(\n                        CONF_ENTITY_NAMING,\n                        default=DEFAULT_ENTITY_NAMING,\n                    ): _entity_naming_selector(),\n                }\n            ),\n            description_placeholders={\n                "minimal": str(counts["minimal"]),\n                "standard": str(counts["standard"]),\n                "extended": str(counts["extended"]),\n                "complete": str(counts["complete"]),\n                "individual": str(counts["individual"]),\n            },\n        )\n'''
          replace('custom_components/nibe_local/config_flow.py', old_form, new_form)

          # Options persist naming mode as well.
          replace(
              'custom_components/nibe_local/config_flow.py',
              '            candidate[CONF_ENTITY_PROFILE] = profile\n            try:',
              '            candidate[CONF_ENTITY_PROFILE] = profile\n            candidate[CONF_ENTITY_NAMING] = str(\n                user_input.get(\n                    CONF_ENTITY_NAMING,\n                    current.get(CONF_ENTITY_NAMING, DEFAULT_ENTITY_NAMING),\n                )\n            )\n            try:'
          )

          # Translations.
          for lang, labels in {
              'de': {
                  'profile_desc': 'Wähle den Entitätsumfang und die Benennung. Auf diesem Gerät verfügbar: Minimal {minimal}, Standard {standard}, Erweitert {extended}, Komplett {complete}; bei Individuell stehen {individual} Variablen zur Auswahl. Home Assistant bestimmt weiterhin das endgültige Entity-ID-Format.',
                  'naming_field': 'Benennung der Entitäten',
                  'ha': 'Home-Assistant-Standard (empfohlen)',
                  'api': 'Lokale API',
                  'tech': 'Technisch',
                  'options_desc': 'Verbindung, Abfrage, Entitätsprofil und Benennung ändern. Das endgültige Entity-ID-Format wird weiterhin von Home Assistant bestimmt.',
              },
              'en': {
                  'profile_desc': 'Choose the entity scope and naming. Available on this device: Minimal {minimal}, Standard {standard}, Extended {extended}, Complete {complete}; Individual offers {individual} variables. Home Assistant continues to determine the final entity ID format.',
                  'naming_field': 'Entity naming',
                  'ha': 'Home Assistant standard (recommended)',
                  'api': 'Local API',
                  'tech': 'Technical',
                  'options_desc': 'Change connection, polling, entity profile, and naming. The final entity ID format is still determined by Home Assistant.',
              },
          }.items():
              path = Path(f'custom_components/nibe_local/translations/{lang}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              step = data['config']['step']['entity_profile']
              step['description'] = labels['profile_desc']
              step.setdefault('data', {})['entity_naming'] = labels['naming_field']
              options_init = data['options']['step']['init']
              options_init['description'] = labels['options_desc']
              options_init.setdefault('data', {})['entity_naming'] = labels['naming_field']
              data.setdefault('selector', {})['entity_naming'] = {
                  'options': {
                      'home_assistant': labels['ha'],
                      'local_api': labels['api'],
                      'technical': labels['tech'],
                  }
              }
              path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          # Changelog.
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 0.9.0\n\n'
          if marker not in text:
              raise RuntimeError('0.9.0 changelog section missing')
          addition = (
              '- Bei der Einrichtung und in den Optionen kann die Entitätsbenennung zwischen **Home-Assistant-Standard**, **Lokale API** und **Technisch** gewählt werden. Home Assistant behält die Kontrolle über das endgültige Entity-ID-Format.\n'
              '- Die Profilauswahl zeigt die Anzahl der auf dem verbundenen Gerät tatsächlich verfügbaren Variablen für Minimal, Standard, Erweitert, Komplett und Individuell an.\n'
          )
          p.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')

          # Regression tests for naming and profile counts.
          p = Path('tests/test_logic.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'from custom_components.nibe_local.entity import entity_unique_id, scaled_value, to_raw',
              'from custom_components.nibe_local.entity import (\n    configured_point_name,\n    entity_unique_id,\n    local_api_point_name,\n    scaled_value,\n    to_raw,\n)'
          )
          text = text.replace(
              'from custom_components.nibe_local.profiles import (',
              'from custom_components.nibe_local.profiles import ('
          )
          # Add profile_counts import when the multiline profile import exists.
          if '    profile_counts,\n' not in text:
              anchor = '    point_enabled,\n'
              if anchor in text:
                  text = text.replace(anchor, anchor + '    profile_counts,\n')
          text += '''\n\ndef test_local_api_and_technical_entity_names() -> None:\n    from custom_components.nibe_local.const import PointDef\n\n    point = {"description": "Current outdoor temperature (BT1)", "metadata": {}}\n    definition = PointDef(4, "outdoor_temperature_bt1", "heating")\n    assert local_api_point_name(point) == "Current outdoor temperature (BT1)"\n    assert configured_point_name("home_assistant", point, definition) is None\n    assert configured_point_name("local_api", point, definition) == "Current outdoor temperature (BT1)"\n    assert configured_point_name("technical", point, definition) == "Current outdoor temperature (BT1) [ID 4]"\n\n\ndef test_profile_counts_only_count_available_points() -> None:\n    counts = profile_counts([4, 8, 10, 3096, 999999])\n    assert counts["minimal"] == 4\n    assert counts["standard"] == 4\n    assert counts["complete"] == 5\n    assert counts["individual"] == 5\n'''
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install homeassistant

      - name: Validate and test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/nibe_local/translations').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          json.loads(Path('custom_components/nibe_local/manifest.json').read_text(encoding='utf-8'))
          PY
          python -m compileall -q custom_components/nibe_local tests
          pytest -q

      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/add-090-entity-naming.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add selectable entity naming for 0.9.0"
          git push
