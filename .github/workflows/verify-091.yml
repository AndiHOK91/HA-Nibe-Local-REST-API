name: Verify v0.9.1

on:
  push:
    paths:
      - '.github/workflows/verify-091.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant-version: ["2024.12.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        env:
          HA_VERSION: ${{ matrix.homeassistant-version }}
        run: |
          python -m pip install --upgrade pip pytest
          if [ "$HA_VERSION" = "latest" ]; then
            python -m pip install homeassistant
          else
            python -m pip install "homeassistant==$HA_VERSION"
          fi
      - name: Validate JSON and Python
        run: |
          python -m json.tool custom_components/nibe_local/manifest.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/de.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/en.json >/dev/null
          python -m compileall -q custom_components/nibe_local tests
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  cleanup:
    needs: verify
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time verification workflow
        run: |
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          rm -f .github/workflows/verify-091.yml
          git add .github/workflows/verify-091.yml
          git commit -m 'Remove one-time v0.9.1 verification workflow'
          git push
