name: Fix brand icon workflow
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-brand-icon-workflow.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Base64 padding and clean up helper
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/replace-brand-icons.yml')
          text = path.read_text()
          old = "raw = base64.b64decode(encoded)"
          new = "raw = base64.b64decode(encoded + '=' * (-len(encoded) % 4))"
          if old not in text:
              raise SystemExit('Decoder line not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/replace-brand-icons.yml
          git commit -m 'Fix brand icon workflow Base64 padding'
          git push
      - name: Remove helper workflow
        run: |
          git pull --rebase
          git rm .github/workflows/fix-brand-icon-workflow.yml
          git commit -m 'Remove brand icon workflow fix helper'
          git push
