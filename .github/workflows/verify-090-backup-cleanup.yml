name: Verify 0.9.0 backup cleanup

on:
  push:
    paths:
      - '.github/workflows/verify-090-backup-cleanup.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant-version: ['2024.12.0', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Add regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_logic.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    _basic_auth_schema,\n',
              '    CONF_BACKUP_BEFORE_CLEANUP,\n    _async_create_cleanup_backup,\n    _basic_auth_schema,\n'
          )
          marker = '\ndef test_cleanup_backup_option_defaults_to_enabled() -> None:\n'
          if marker not in text:
              text += '''\n\ndef test_cleanup_backup_option_defaults_to_enabled() -> None:\n    from custom_components.nibe_local.config_flow import _options_schema\n\n    backup_marker = next(\n        item\n        for item in _options_schema({}).schema\n        if getattr(item, "schema", None) == CONF_BACKUP_BEFORE_CLEANUP\n    )\n    default = backup_marker.default\n    assert (default() if callable(default) else default) is True\n\n\ndef test_cleanup_backup_prefers_supervisor_full_backup() -> None:\n    class Services:\n        def __init__(self):\n            self.calls = []\n\n        def has_service(self, domain, service):\n            return (domain, service) in {\n                ("hassio", "backup_full"),\n                ("backup", "create"),\n            }\n\n        async def async_call(self, domain, service, data, *, blocking=False):\n            self.calls.append((domain, service, data, blocking))\n\n    async def run_test():\n        services = Services()\n        hass = SimpleNamespace(services=services)\n        await _async_create_cleanup_backup(hass)\n        assert services.calls == [\n            (\n                "hassio",\n                "backup_full",\n                {"name": "NIBE Local REST API - Registry cleanup"},\n                True,\n            )\n        ]\n\n    asyncio.run(run_test())\n\n\ndef test_cleanup_backup_uses_core_backup_when_supervisor_unavailable() -> None:\n    class Services:\n        def __init__(self):\n            self.calls = []\n\n        def has_service(self, domain, service):\n            return (domain, service) == ("backup", "create")\n\n        async def async_call(self, domain, service, data, *, blocking=False):\n            self.calls.append((domain, service, data, blocking))\n\n    async def run_test():\n        services = Services()\n        hass = SimpleNamespace(services=services)\n        await _async_create_cleanup_backup(hass)\n        assert services.calls == [("backup", "create", {}, True)]\n\n    asyncio.run(run_test())\n'''
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install test dependencies
        env:
          HA_VERSION: ${{ matrix.homeassistant-version }}
        run: |
          python -m pip install --upgrade pip pytest
          if [ "$HA_VERSION" = "latest" ]; then
            python -m pip install homeassistant
          else
            python -m pip install "homeassistant==$HA_VERSION"
          fi

      - name: Validate and test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q custom_components/nibe_local tests
          python -m json.tool custom_components/nibe_local/translations/de.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/en.json >/dev/null
          pytest -q

      - name: Commit tests and remove workflow
        if: matrix.homeassistant-version == 'latest'
        run: |
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          # Wait briefly for the compatibility leg to finish before publishing.
          sleep 5
          rm -f .github/workflows/verify-090-backup-cleanup.yml
          git add -A
          git commit -m 'Test backup-protected registry cleanup'
          git push
