name: Refine 0.9.0 options and auth

on:
  push:
    paths:
      - '.github/workflows/refine-090-options-auth.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply auth-step and registry-cleanup changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('custom_components/nibe_local/config_flow.py')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              'from homeassistant.helpers.aiohttp_client import async_get_clientsession\n',
              'from homeassistant.helpers.aiohttp_client import async_get_clientsession\nfrom homeassistant.helpers import entity_registry as er\n'
          )
          text = text.replace(
              '    PROFILE_INDIVIDUAL,\n    normalize_selected_ids,\n    profile_counts,\n)',
              '    PROFILE_INDIVIDUAL,\n    normalize_selected_ids,\n    point_enabled,\n    profile_counts,\n)'
          )
          text = text.replace(
              '_AUTH_METHODS = (AUTH_METHOD_BASIC, AUTH_METHOD_HEADER)\n',
              '_AUTH_METHODS = (AUTH_METHOD_BASIC, AUTH_METHOD_HEADER)\nCONF_REMOVE_INACTIVE_ENTITIES = "remove_inactive_entities"\n'
          )

          start = text.index('def _connection_schema(')
          end = text.index('\ndef _reauth_schema', start)
          replacement = '''def _connection_schema(defaults: dict) -> vol.Schema:\n    """Connection settings shown before method-specific credentials."""\n    return vol.Schema(\n        {\n            vol.Required(CONF_HOST, default=defaults.get(CONF_HOST, "")): str,\n            vol.Required(CONF_PORT, default=defaults.get(CONF_PORT, DEFAULT_PORT)): vol.All(\n                int, vol.Range(min=1, max=65535)\n            ),\n            vol.Required(\n                CONF_AUTH_METHOD, default=auth_method_from_values(defaults)\n            ): _auth_method_selector(),\n            vol.Required(\n                CONF_VERIFY_SSL, default=defaults.get(CONF_VERIFY_SSL, False)\n            ): bool,\n            vol.Required(\n                CONF_SCAN_INTERVAL,\n                default=defaults.get(CONF_SCAN_INTERVAL, DEFAULT_SCAN_INTERVAL),\n            ): vol.All(int, vol.Range(min=MIN_SCAN_INTERVAL, max=600)),\n            vol.Required(\n                CONF_COMMAND_POLL_DELAY_MS,\n                default=defaults.get(\n                    CONF_COMMAND_POLL_DELAY_MS, DEFAULT_COMMAND_POLL_DELAY_MS\n                ),\n            ): vol.In(COMMAND_POLL_DELAY_OPTIONS_MS),\n        }\n    )\n\n\ndef _basic_auth_schema(defaults: dict, *, password_default: str = "") -> vol.Schema:\n    return vol.Schema(\n        {\n            vol.Optional(CONF_USERNAME, default=defaults.get(CONF_USERNAME, "")): str,\n            vol.Optional(CONF_PASSWORD, default=password_default): _secret_selector(\n                autocomplete="current-password"\n            ),\n        }\n    )\n\n\ndef _header_auth_schema(*, auth_header_default: str = "") -> vol.Schema:\n    return vol.Schema(\n        {\n            vol.Optional(CONF_AUTH_HEADER, default=auth_header_default): _secret_selector()\n        }\n    )\n\n\ndef _options_schema(current: dict) -> vol.Schema:\n    fields = dict(_connection_schema(current).schema)\n    fields[\n        vol.Required(\n            CONF_ENTITY_PROFILE,\n            default=current.get(CONF_ENTITY_PROFILE, DEFAULT_ENTITY_PROFILE),\n        )\n    ] = _entity_profile_selector()\n    fields[\n        vol.Required(\n            CONF_ENTITY_NAMING,\n            default=current.get(CONF_ENTITY_NAMING, DEFAULT_ENTITY_NAMING),\n        )\n    ] = _entity_naming_selector()\n    fields[vol.Optional(CONF_REMOVE_INACTIVE_ENTITIES, default=False)] = bool\n    return vol.Schema(fields)\n\n\nasync def _async_remove_inactive_point_entities(\n    hass, entry: ConfigEntry, profile: str, selected_ids\n) -> int:\n    """Remove only deselected point-backed entities when explicitly requested."""\n    registry = er.async_get(hass)\n    prefix = f"{entry.entry_id}_"\n    removed = 0\n    for registry_entry in er.async_entries_for_config_entry(registry, entry.entry_id):\n        unique_id = registry_entry.unique_id\n        if not unique_id.startswith(prefix):\n            continue\n        suffix = unique_id[len(prefix):]\n        if not suffix.isdigit():\n            continue\n        if point_enabled(profile, int(suffix), selected_ids):\n            continue\n        registry.async_remove(registry_entry.entity_id)\n        removed += 1\n    return removed\n\n'''
          text = text[:start] + replacement + text[end:]

          old_user = '''    async def async_step_user(self, user_input=None):\n        errors: dict[str, str] = {}\n        if user_input is not None:\n            candidate = merge_auth_settings(dict(user_input), {})\n            try:\n                device, points = await _validate_and_discover(self.hass, candidate)\n            except NibeAuthError:\n                errors["base"] = "invalid_auth"\n            except NibeApiError:\n                errors["base"] = "cannot_connect"\n            else:\n                product = device.get("product") or {}\n                serial = product.get("serialNumber") or (\n                    f"{candidate[CONF_HOST]}:{NIBE_DEVICE_ID}"\n                )\n                await self.async_set_unique_id(str(serial))\n                self._abort_if_unique_id_configured()\n                self._pending_data = candidate\n                self._pending_device = device\n                self._available_points = points\n                return await self.async_step_entity_profile()\n\n        return self.async_show_form(\n            step_id="user",\n            data_schema=_connection_schema({}),\n            errors=errors,\n        )\n'''
          new_user = '''    async def async_step_user(self, user_input=None):\n        if user_input is not None:\n            self._pending_data = dict(user_input)\n            if auth_method_from_values(self._pending_data) == AUTH_METHOD_HEADER:\n                return await self.async_step_auth_header()\n            return await self.async_step_auth_basic()\n\n        return self.async_show_form(\n            step_id="user",\n            data_schema=_connection_schema({}),\n        )\n\n    async def _async_finish_auth(self, user_input: dict, step_id: str):\n        if self._pending_data is None:\n            return self.async_abort(reason="setup_state_missing")\n        candidate = merge_auth_settings(\n            {**self._pending_data, **dict(user_input)}, {}\n        )\n        errors: dict[str, str] = {}\n        try:\n            device, points = await _validate_and_discover(self.hass, candidate)\n        except NibeAuthError:\n            errors["base"] = "invalid_auth"\n        except NibeApiError:\n            errors["base"] = "cannot_connect"\n        else:\n            product = device.get("product") or {}\n            serial = product.get("serialNumber") or (\n                f"{candidate[CONF_HOST]}:{NIBE_DEVICE_ID}"\n            )\n            await self.async_set_unique_id(str(serial))\n            self._abort_if_unique_id_configured()\n            self._pending_data = candidate\n            self._pending_device = device\n            self._available_points = points\n            return await self.async_step_entity_profile()\n\n        schema = (\n            _header_auth_schema()\n            if step_id == "auth_header"\n            else _basic_auth_schema(self._pending_data)\n        )\n        return self.async_show_form(step_id=step_id, data_schema=schema, errors=errors)\n\n    async def async_step_auth_basic(self, user_input=None):\n        if self._pending_data is None:\n            return self.async_abort(reason="setup_state_missing")\n        if user_input is not None:\n            return await self._async_finish_auth(dict(user_input), "auth_basic")\n        return self.async_show_form(\n            step_id="auth_basic", data_schema=_basic_auth_schema(self._pending_data)\n        )\n\n    async def async_step_auth_header(self, user_input=None):\n        if self._pending_data is None:\n            return self.async_abort(reason="setup_state_missing")\n        if user_input is not None:\n            return await self._async_finish_auth(dict(user_input), "auth_header")\n        return self.async_show_form(\n            step_id="auth_header", data_schema=_header_auth_schema()\n        )\n'''
          if old_user not in text:
              raise RuntimeError('old user flow block not found')
          text = text.replace(old_user, new_user)

          cls_start = text.index('class NibeLocalOptionsFlow')
          text = text[:cls_start] + '''class NibeLocalOptionsFlow(config_entries.OptionsFlow):\n    """Edit connection, polling, entity profile, naming and credentials."""\n\n    _pending_options: dict | None = None\n    _available_points: dict[str, Any] | None = None\n    _cleanup_inactive = False\n\n    async def async_step_init(self, user_input=None):\n        current = {**self.config_entry.data, **self.config_entry.options}\n        if user_input is not None:\n            submitted = dict(user_input)\n            self._cleanup_inactive = bool(\n                submitted.pop(CONF_REMOVE_INACTIVE_ENTITIES, False)\n            )\n            self._pending_options = merge_auth_settings(submitted, current)\n            if auth_method_from_values(self._pending_options) == AUTH_METHOD_HEADER:\n                return await self.async_step_auth_header()\n            return await self.async_step_auth_basic()\n\n        return self.async_show_form(\n            step_id="init",\n            data_schema=_options_schema(current),\n        )\n\n    async def _async_finish_auth(self, user_input: dict, step_id: str):\n        if self._pending_options is None:\n            return self.async_abort(reason="setup_state_missing")\n        candidate = merge_auth_settings(dict(user_input), self._pending_options)\n        profile = str(candidate.get(CONF_ENTITY_PROFILE, DEFAULT_ENTITY_PROFILE))\n        errors: dict[str, str] = {}\n        try:\n            _device, points = await _validate_and_discover(self.hass, candidate)\n        except NibeAuthError:\n            errors["base"] = "invalid_auth"\n        except NibeApiError:\n            errors["base"] = "cannot_connect"\n        else:\n            self._pending_options = candidate\n            self._available_points = points\n            if profile == PROFILE_INDIVIDUAL:\n                return await self.async_step_entity_selection()\n            if self._cleanup_inactive:\n                await _async_remove_inactive_point_entities(\n                    self.hass, self.config_entry, profile, candidate.get(CONF_SELECTED_POINT_IDS, ())\n                )\n            return self.async_create_entry(title="", data=candidate)\n\n        current = {**self.config_entry.data, **self.config_entry.options}\n        schema = (\n            _header_auth_schema()\n            if step_id == "auth_header"\n            else _basic_auth_schema(current)\n        )\n        return self.async_show_form(step_id=step_id, data_schema=schema, errors=errors)\n\n    async def async_step_auth_basic(self, user_input=None):\n        if self._pending_options is None:\n            return self.async_abort(reason="setup_state_missing")\n        current = {**self.config_entry.data, **self.config_entry.options}\n        if user_input is not None:\n            return await self._async_finish_auth(dict(user_input), "auth_basic")\n        return self.async_show_form(\n            step_id="auth_basic",\n            data_schema=_basic_auth_schema(current, password_default=""),\n        )\n\n    async def async_step_auth_header(self, user_input=None):\n        if self._pending_options is None:\n            return self.async_abort(reason="setup_state_missing")\n        if user_input is not None:\n            return await self._async_finish_auth(dict(user_input), "auth_header")\n        return self.async_show_form(\n            step_id="auth_header", data_schema=_header_auth_schema(auth_header_default="")\n        )\n\n    async def async_step_entity_selection(self, user_input=None):\n        if self._pending_options is None:\n            return self.async_abort(reason="setup_state_missing")\n        points = self._available_points or {}\n        if user_input is not None:\n            self._pending_options[CONF_SELECTED_POINT_IDS] = _parse_selected_options(\n                user_input.get(CONF_SELECTED_POINT_IDS)\n            )\n            if self._cleanup_inactive:\n                await _async_remove_inactive_point_entities(\n                    self.hass,\n                    self.config_entry,\n                    PROFILE_INDIVIDUAL,\n                    self._pending_options[CONF_SELECTED_POINT_IDS],\n                )\n            return self.async_create_entry(title="", data=self._pending_options)\n\n        return self.async_show_form(\n            step_id="entity_selection",\n            data_schema=_entity_selection_schema(\n                points,\n                self._pending_options.get(CONF_SELECTED_POINT_IDS),\n            ),\n            description_placeholders={"count": str(len(points))},\n        )\n'''
          p.write_text(text, encoding='utf-8')

          # Translations: method-specific steps and explicit cleanup wording.
          for lang in ('de', 'en'):
              path = Path(f'custom_components/nibe_local/translations/{lang}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              cfg = data['config']['step']
              if lang == 'de':
                  cfg['user']['description'] = 'Verbindung und Authentifizierungsmethode wählen. Die Zugangsdaten werden im nächsten Schritt passend zur gewählten Methode abgefragt.'
                  cfg['auth_basic'] = {'title':'Benutzername + Passwort','description':'Gib die Zugangsdaten für die lokale REST API ein.','data':{'username':'Benutzername','password':'Passwort'}}
                  cfg['auth_header'] = {'title':'Authorization-Header','description':'Gib den vollständigen HTTP-Authorization-Header der lokalen REST API ein.','data':{'auth_header':'Authorization-Header'}}
                  opt = data['options']['step']
                  opt['init']['description'] = 'Verbindung, Abfrage, Entitätsprofil, Benennung und Authentifizierungsmethode ändern. Zugangsdaten werden im nächsten Schritt passend zur Methode abgefragt. Die Registry-Bereinigung ist optional und löscht nur abgewählte Punkt-Entitäten.'
                  opt['init'].setdefault('data', {})['remove_inactive_entities'] = 'Nicht mehr verwendete Punkt-Entitäten aus der Registry entfernen'
                  opt['auth_basic'] = {'title':'Benutzername + Passwort','description':'Benutzername ändern oder ein neues Passwort eintragen. Ein leeres Passwort behält den bisherigen Wert.','data':{'username':'Benutzername','password':'Neues Passwort (leer = unverändert)'}}
                  opt['auth_header'] = {'title':'Authorization-Header','description':'Einen neuen Authorization-Header eintragen. Ein leeres Feld behält den bisherigen Wert.','data':{'auth_header':'Neuer Authorization-Header (leer = unverändert)'}}
              else:
                  cfg['user']['description'] = 'Choose the connection and authentication method. Credentials are requested in the next step for the selected method only.'
                  cfg['auth_basic'] = {'title':'Username + password','description':'Enter the credentials for the local REST API.','data':{'username':'Username','password':'Password'}}
                  cfg['auth_header'] = {'title':'Authorization header','description':'Enter the complete HTTP Authorization header for the local REST API.','data':{'auth_header':'Authorization header'}}
                  opt = data['options']['step']
                  opt['init']['description'] = 'Change connection, polling, entity profile, naming, and authentication method. Credentials are requested in the next step for the selected method only. Registry cleanup is optional and removes only deselected point entities.'
                  opt['init'].setdefault('data', {})['remove_inactive_entities'] = 'Remove no-longer-used point entities from the registry'
                  opt['auth_basic'] = {'title':'Username + password','description':'Change the username or enter a new password. Leaving the password empty keeps the stored value.','data':{'username':'Username','password':'New password (empty = unchanged)'}}
                  opt['auth_header'] = {'title':'Authorization header','description':'Enter a new Authorization header. Leaving it empty keeps the stored value.','data':{'auth_header':'New Authorization header (empty = unchanged)'}}
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Regression tests for method-specific schemas and cleanup guard.
          tp = Path('tests/test_logic.py')
          tests = tp.read_text(encoding='utf-8')
          tests = tests.replace(
              '    _connection_schema,\n    _reauth_schema,',
              '    _basic_auth_schema,\n    _connection_schema,\n    _header_auth_schema,\n    _reauth_schema,'
          )
          tests += '''\n\ndef test_connection_form_contains_no_credentials() -> None:\n    schema = _connection_schema({}).schema\n    keys = {marker.schema for marker in schema}\n    assert CONF_USERNAME not in keys\n    assert CONF_PASSWORD not in keys\n    assert CONF_AUTH_HEADER not in keys\n    assert CONF_AUTH_METHOD in keys\n\n\ndef test_basic_auth_form_only_contains_basic_credentials() -> None:\n    keys = {marker.schema for marker in _basic_auth_schema({}).schema}\n    assert keys == {CONF_USERNAME, CONF_PASSWORD}\n\n\ndef test_header_auth_form_only_contains_header() -> None:\n    keys = {marker.schema for marker in _header_auth_schema().schema}\n    assert keys == {CONF_AUTH_HEADER}\n'''
          tp.write_text(tests, encoding='utf-8')

          # README and changelog.
          rp = Path('README.md')
          readme = rp.read_text(encoding='utf-8')
          marker = '## Entitätsbenennung\n'
          auth_note = '''## Dynamischer Authentifizierungsdialog\n\nDie Einrichtung fragt zuerst nur die **Authentifizierungsmethode** ab. Im folgenden Schritt werden ausschließlich die dazu passenden Zugangsdaten angezeigt:\n\n- **Benutzername + Passwort** → nur Benutzername und Passwort\n- **Authorization-Header** → nur der Header\n\nNicht verwendete Zugangsdatenfelder werden dadurch nicht parallel angezeigt. Dasselbe Prinzip gilt in den Integrationsoptionen und bei der Reauthentifizierung.\n\n## Optionale Registry-Bereinigung\n\nBeim Wechsel auf ein kleineres Entitätsprofil bleiben abgewählte Entitäten standardmäßig in der Home-Assistant-Entity-Registry erhalten. So können vorhandene Entity-IDs und Verknüpfungen bei einer späteren Reaktivierung erhalten bleiben.\n\nIn den Optionen kann ausdrücklich **„Nicht mehr verwendete Punkt-Entitäten aus der Registry entfernen“** aktiviert werden. Nur dann entfernt die Integration abgewählte, punktbasierte Entitäten aus der Registry. Diagnose- und Integrationsentitäten werden dabei nicht gelöscht. Diese Bereinigung ist bewusst nicht automatisch aktiviert.\n\n'''
          if marker in readme and '## Dynamischer Authentifizierungsdialog' not in readme:
              readme = readme.replace(marker, auth_note + marker)
          rp.write_text(readme, encoding='utf-8')

          cp = Path('CHANGELOG.md')
          change = cp.read_text(encoding='utf-8')
          anchor = '## 0.9.0\n\n'
          bullets = ('- Authentifizierung in Einrichtung und Optionen in zwei Schritte getrennt: Nach Wahl der Methode werden nur Benutzername + Passwort oder nur der Authorization-Header angezeigt.\n'
                     '- Optionale Registry-Bereinigung ergänzt: Abgewählte Punkt-Entitäten werden nur auf ausdrücklichen Wunsch aus der Entity Registry entfernt; standardmäßig bleiben sie für stabile Entity-IDs erhalten.\n')
          if bullets.splitlines()[0] not in change:
              change = change.replace(anchor, anchor + bullets)
          cp.write_text(change, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Validate and test
        run: |
          python -m json.tool custom_components/nibe_local/translations/de.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/en.json >/dev/null
          python -m compileall -q custom_components tests
          pytest -q

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          rm .github/workflows/refine-090-options-auth.yml
          git add -A
          git commit -m 'Refine auth flow and optional entity cleanup for 0.9.0'
          git push
