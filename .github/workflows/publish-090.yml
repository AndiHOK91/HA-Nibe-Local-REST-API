name: Publish v0.9.0

on:
  push:
    paths:
      - '.github/workflows/publish-090.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/nibe_local/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.9.0', manifest['version']
          assert '## 0.9.0' in Path('CHANGELOG.md').read_text(encoding='utf-8')
          assert 'Aktuelle Integrationsversion: **0.9.0**' in Path('README.md').read_text(encoding='utf-8')
          PY
          python -m json.tool custom_components/nibe_local/translations/de.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/en.json >/dev/null
          python -m compileall -q custom_components/nibe_local
          find custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          if git ls-remote --tags origin refs/tags/v0.9.0 | grep -q .; then
            echo 'Tag v0.9.0 already exists' >&2
            exit 1
          fi

      - name: Remove one-time workflow and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          rm -f .github/workflows/publish-090.yml
          git add -A
          git commit -m 'Prepare v0.9.0 release'
          git push
          RELEASE_SHA=$(git rev-parse HEAD)
          gh release create v0.9.0 \
            --target "$RELEASE_SHA" \
            --title 'v0.9.0' \
            --notes-file - <<'EOF'
          ## NIBE Local REST API 0.9.0

          Größeres Funktions- und Sicherheitsupdate für die lokale NIBE-Integration.

          ### Highlights
          - Entitätsprofile: Minimal, Standard, Erweitert, Komplett und Individuell
          - Geräteabhängige Profilzählung und individuelle Punkt-Auswahl
          - Drei Benennungsmodi: Home-Assistant-Standard, Lokale API und Technisch
          - Zweistufige Authentifizierung mit dynamisch getrennten Eingabefeldern
          - Optionale Registry-Bereinigung mit standardmäßig vorgeschaltetem Home-Assistant-Backup
          - Minimalprofil mit Kernzuständen, Haupt-/Brauchwassertemperaturen einschließlich BT70 sowie Verdichterstatus und -frequenz
          - Standardprofil mit alltagstauglichen Funktionen einschließlich Mehr Brauchwasser und Lüftung+
          - Unbekannte Punkte im Komplettprofil bleiben konsequent schreibgeschützt
          - Härtung von REST-Antwortverarbeitung, Schreibzugriffen, Multi-Instance-Unique-IDs und Upgrade-Kompatibilität

          Bestehende Installationen aus 0.8.x bleiben kompatibel und verwenden ohne explizite Profilwahl weiterhin Erweitert.

          Details siehe `CHANGELOG.md` und `README.md`.
          EOF
