name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Testabhängigkeiten installieren
        run: python -m pip install --upgrade pip pytest homeassistant

      - name: Regressionstests ausführen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
