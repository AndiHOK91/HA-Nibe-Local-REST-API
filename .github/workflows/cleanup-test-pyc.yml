name: Cleanup test bytecode artifacts

on:
  push:
    paths:
      - '.github/workflows/cleanup-test-pyc.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore tracked bytecode and remove workflow
        run: |
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          base='2f96dcfdb6976f42649d6e46f3ffdfd738a525c8'
          while IFS= read -r file; do
            if git cat-file -e "$base:$file" 2>/dev/null; then
              git checkout "$base" -- "$file"
            fi
          done < <(git ls-files | grep -E '(^|/)__pycache__/.*\.pyc$' || true)
          rm -f .github/workflows/cleanup-test-pyc.yml
          git add -A
          git commit -m 'Restore tracked bytecode after regression tests'
          git push
