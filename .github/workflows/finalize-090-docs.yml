name: Finalize 0.9.0 documentation

on:
  push:
    paths:
      - '.github/workflows/finalize-090-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Finalize README and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '| **Minimal** | Kernwerte für Dashboard und Grundbetrieb | Nur die wichtigsten Betriebs-, Temperatur-, Brauchwasser- und Verdichterwerte sowie zentrale Bedienfunktionen |',
              '| **Minimal** | Kernwerte für Dashboard und Grundbetrieb | Kernzustände, Haupttemperaturen, Brauchwassertemperaturen sowie Verdichterstatus und -frequenz |'
          )
          text = text.replace(
              '- Außentemperatur\n- Vorlauf und Rücklauf\n- Außentemperatur\n- Vorlauf und Rücklauf\n- Raumtemperatur\n',
              '- Außentemperatur\n- Vorlauf und Rücklauf\n- Raumtemperatur\n'
          )
          text = text.replace(
              '- Temperatur während der Brauchwasserbereitung\n',
              '- Temperatur während der Brauchwasserbereitung\n- Brauchwasseraustritt (BT70)\n'
          )
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '## 0.9.0\n\n'
          bullets = (
              '- Entitätsprofile final geschärft: **Minimal** konzentriert sich auf Betriebsmodus/-priorität, Haupt- und Brauchwassertemperaturen, Verdichterstatus und Verdichterfrequenz; **Standard** ergänzt normale Bedienung, Komfort-, Energie- und Betriebsdiagnosewerte, während technische Druck-/Elektronik-, Zusatzheizungs- und detaillierte Service-/Abtauwerte **Erweitert** vorbehalten bleiben.\n'
              '- Punkt **116 – Brauchwasseraustritt (BT70)** als bekannter schreibgeschützter Temperatursensor ergänzt und in Minimal aufgenommen.\n'
              '- **Mehr Brauchwasser** und **Lüftung+** bleiben im Standardprofil als alltagstaugliche Bedienfunktionen verfügbar.\n'
          )
          if bullets not in text:
              text = text.replace(anchor, anchor + bullets, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

          python -m json.tool custom_components/nibe_local/translations/de.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/en.json >/dev/null
          python -m compileall -q custom_components/nibe_local

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          find custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/workflows/finalize-090-docs.yml
          git add -A
          git commit -m 'Finalize 0.9.0 documentation'
          git push
