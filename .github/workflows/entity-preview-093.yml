name: Entity preview v0.9.3

on:
  push:
    paths:
      - '.github/workflows/entity-preview-093.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant-version: ["2024.12.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare v0.9.3 entity preview changes
        run: |
          python .github/scripts/add_entity_preview.py
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/nibe_local/config_flow.py")
          text = path.read_text(encoding="utf-8")
          old = '    inactive = frozenset((available - active) | (disabled_registered - delete))'
          new = '    inactive = frozenset(((available - active) | disabled_registered) - delete)'
          if old not in text:
              raise SystemExit("preview inactive-group patch anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install test dependencies
        env:
          HA_VERSION: ${{ matrix.homeassistant-version }}
        run: |
          python -m pip install --upgrade pip pytest
          if [ "$HA_VERSION" = "latest" ]; then
            python -m pip install homeassistant
          else
            python -m pip install "homeassistant==$HA_VERSION"
          fi
      - name: Validate and test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/nibe_local/manifest.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/de.json >/dev/null
          python -m json.tool custom_components/nibe_local/translations/en.json >/dev/null
          python -m compileall -q custom_components/nibe_local tests
          pytest -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare and commit v0.9.3
        run: |
          python .github/scripts/add_entity_preview.py
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/nibe_local/config_flow.py")
          text = path.read_text(encoding="utf-8")
          old = '    inactive = frozenset((available - active) | (disabled_registered - delete))'
          new = '    inactive = frozenset(((available - active) | disabled_registered) - delete)'
          if old not in text:
              raise SystemExit("preview inactive-group patch anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name 'AndiO91'
          git config user.email '60509228+AndiO91@users.noreply.github.com'
          rm -f .github/scripts/add_entity_preview.py .github/workflows/entity-preview-093.yml
          git add custom_components/nibe_local/config_flow.py \
                  custom_components/nibe_local/translations/de.json \
                  custom_components/nibe_local/translations/en.json \
                  custom_components/nibe_local/manifest.json \
                  tests/test_logic.py README.md CHANGELOG.md \
                  .github/scripts/add_entity_preview.py \
                  .github/workflows/entity-preview-093.yml
          git commit -m 'Add final entity preview and release v0.9.3'
          git push
      - name: Publish v0.9.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag v0.9.3
          git push origin v0.9.3
          gh release create v0.9.3 --title 'v0.9.3' --notes $'## NIBE Local REST API 0.9.3\n\nNeue finale Entitätsübersicht vor dem Anwenden von Einrichtung oder Optionen.\n\n- Zeigt aktive/ausgewählte Punkte mit Name, Variable-ID und Einheit.\n- Zeigt abgewählte, aber beibehaltene Punkte separat.\n- Zeigt exakt die numerischen Registry-Punkte, die bei aktivierter Bereinigung gelöscht würden.\n- Bei bestehenden Installationen werden bereits registrierte und neue aktive Punkte getrennt gezählt.\n- Zusätzliche Diagnose- und Spezialentitäten werden separat aufgeführt.\n- Große Listen sind auf 50 sichtbare Einträge je Bereich begrenzt; die Zähler bleiben vollständig.\n- Backup und Registry-Löschung erfolgen erst nach der finalen Bestätigung.\n- Verifiziert mit Home Assistant 2024.12.0 und der aktuellen Home-Assistant-Version.\n'
