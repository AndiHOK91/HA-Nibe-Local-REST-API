export_extended_diagnostics:
  name: Erweiterte Diagnosedaten exportieren
  description: >-
    Gibt bewusst erweiterte Diagnosedaten für eine NIBE-Instanz zurück. Diese
    enthalten aktuelle Mess-/Einstellwerte und die ausgewählte Recorder-Historie.
    Vor öffentlicher Weitergabe prüfen.
  fields:
    config_entry_id:
      name: NIBE-Konfiguration
      description: NIBE-Local-REST-API-Instanz für den erweiterten Diagnoseexport.
      required: true
      selector:
        config_entry:
          integration: nibe_local
    history_days:
      name: Historienlänge
      description: Recorder-Historie für den erweiterten Export.
      required: false
      default: 1
      selector:
        select:
          options:
            - label: 1 Tag
              value: 1
            - label: 3 Tage
              value: 3
            - label: 5 Tage
              value: 5
            - label: 7 Tage
              value: 7
          mode: dropdown

preview_statistics_migration:
  name: Statistikmigration prüfen
  description: >-
    Vergleicht die Langzeitstatistik eines bisherigen Sensors mit einem
    NIBE-Local-REST-API-Sensor. Die Aktion ist ausschließlich lesend und
    verändert keine Recorder-Daten.
  fields:
    source_entity_id:
      name: Quellsensor
      description: Bisheriger Sensor, z. B. aus der Modbus-Integration.
      required: true
      selector:
        entity:
          domain: sensor
    target_entity_id:
      name: REST-Zielsensor
      description: Zugehöriger Sensor der NIBE Local REST API.
      required: true
      selector:
        entity:
          domain: sensor
          integration: nibe_local

import_statistics_migration:
  name: Historische Statistik importieren
  description: >-
    Übernimmt ausschließlich fehlende stündliche Langzeitstatistiken eines
    bisherigen Sensors in einen NIBE-Local-REST-API-Sensor. Vorhandene
    Zielzeitpunkte werden nicht überschrieben. Standardmäßig wird vor dem
    Import eine Sicherung der Zielstatistik erstellt.
  fields:
    source_entity_id:
      name: Quellsensor
      description: Bisheriger Sensor, z. B. aus der Modbus-Integration.
      required: true
      selector:
        entity:
          domain: sensor
    target_entity_id:
      name: REST-Zielsensor
      description: Zugehöriger Sensor der NIBE Local REST API.
      required: true
      selector:
        entity:
          domain: sensor
          integration: nibe_local
    create_backup:
      name: Backup erstellen
      description: >-
        Sichert die vorhandene Ziel-Langzeitstatistik und Metadaten vor dem
        Import. Wenn das Backup aktiviert ist und nicht erstellt werden kann,
        wird der Import abgebrochen.
      required: false
      default: true
      selector:
        boolean:

list_statistics_backups:
  name: Statistik-Backups auflisten
  description: >-
    Listet alle von der NIBE-Statistikmigration angelegten Sicherungen auf,
    neueste zuerst. Die Aktion ist ausschließlich lesend.

preview_statistics_restore:
  name: Statistik-Wiederherstellung prüfen
  description: >-
    Vergleicht ein ausgewähltes älteres Statistik-Backup mit dem heutigen
    Zustand des REST-Zielsensors. Es werden keine Recorder-Daten verändert.
    Den Dateinamen erhältst du zuvor über „Statistik-Backups auflisten“.
  fields:
    backup_file:
      name: Backup-Datei
      description: >-
        Dateiname eines vorhandenen NIBE-Statistik-Backups, zum Beispiel
        sensor_nibe_api_outdoor_temperature_bt1_20260906T142315Z.json.
      required: true
      selector:
        text:
